<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16203A">
<title>Day by Datum</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous" onload="window.__chartReady&&window.__chartReady()"></script>
<style>
:root{
  --bg:#EDF0F4;--card:#FFFFFF;--ink:#16203A;--muted:#5B6479;--line:#D6DBE4;
  --amber:#F2A900;--amber-soft:#FFF4D6;--done:#2E7D5B;--done-soft:#E6F3EC;--miss:#B8322A;--miss-soft:#FBEAE8;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1524;--card:#18213A;--ink:#E8ECF4;--muted:#9AA3B8;--line:#2A3553;
  --amber:#F2B632;--amber-soft:#3A2E0A;--done:#4CB387;--done-soft:#12291F;--miss:#E8665C;--miss-soft:#2E1719;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1524;--card:#18213A;--ink:#E8ECF4;--muted:#9AA3B8;--line:#2A3553;
  --amber:#F2B632;--amber-soft:#3A2E0A;--done:#4CB387;--done-soft:#12291F;--miss:#E8665C;--miss-soft:#2E1719;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.date{font-family:var(--display);font-weight:600;font-size:1.3rem}
.tabs{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{font:inherit;font-size:.9rem;font-weight:700;border:0;background:transparent;color:var(--muted);padding:7px 11px;border-radius:7px;cursor:pointer}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.hero{margin:22px 0 6px}
.hero-time{font-family:var(--display);font-weight:700;font-size:clamp(3.6rem,17vw,5.6rem);line-height:.88}
.hero-label{font-size:1.05rem;color:var(--muted);margin-top:6px}
.track{position:relative;height:50px;margin:20px 6px 4px}
.track-line,.track-fill{position:absolute;left:0;top:12px;height:6px;border-radius:3px}
.track-line{right:0;background:var(--line)}
.track-fill{background:var(--ink);opacity:.35}
.tick{position:absolute;top:6px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.tick i{display:block;width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--ink)}
.tick.passed i{background:var(--ink)}
.tick.late i{border-color:var(--miss);background:var(--miss)}
.tick.late span{color:var(--miss);font-weight:700}
.now{position:absolute;top:2px;width:3px;height:26px;border-radius:2px;background:var(--amber);transform:translateX(-50%)}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-weight:700;font-size:1.05rem}
.bad-text{color:var(--miss)}
.notice{background:var(--amber-soft);border-left:4px solid var(--amber);padding:12px 14px;border-radius:6px;margin:16px 0 0}
.notice p{margin:0}
.notice p+p{margin-top:6px}
.link{font:inherit;font-weight:700;color:inherit;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.slot{margin-top:28px}
.slot-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px}
.slot-head h2{font-family:var(--display);font-weight:600;font-size:1.55rem;margin:0}
.slot-head span{font-size:.9rem;color:var(--muted)}
.slot-head span.bad-text{color:var(--miss);font-weight:700}
.items{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:10px 12px;padding:14px;border-top:1px solid var(--line);border-left:5px solid transparent;align-items:center}
.item:first-child{border-top:0}
.item.done{border-left-color:var(--done);background:var(--done-soft)}
.item.missed{border-left-color:var(--miss);background:var(--miss-soft)}
.item.overdue{border-left-color:var(--amber)}
.item-title{font-weight:700;display:block}
.item-meta{font-size:.85rem;color:var(--muted)}
.late-tag{color:var(--miss);font-weight:700}
.item-actions{display:flex;gap:6px}
.btn{font:inherit;font-weight:700;font-size:.9rem;padding:9px 13px;min-height:42px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.b-done[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#fff}
.b-miss[aria-pressed="true"]{background:var(--miss);border-color:var(--miss);color:#fff}
.b-primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.b-danger{color:var(--miss);border-color:var(--miss)}
.btn-wide{width:100%;margin-top:14px}
.item.bypassed{border-left-color:var(--muted);background:transparent}
.item.bypassed .item-title{color:var(--muted)}
.item.group{padding-bottom:4px;grid-template-columns:1fr}
.item.sub{border-top:0;padding-left:30px}
.item.sub .item-title{font-weight:400}
.b-byp[aria-pressed="true"]{background:var(--muted);border-color:var(--muted);color:var(--bg)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 7px;border-radius:5px;color:#fff}
.tag-missed{background:var(--miss)}.tag-bypassed{background:var(--muted)}
textarea{font:inherit;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%;resize:vertical}
.tabs{flex-wrap:wrap}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cal-nav{display:flex;gap:6px}
.cal-nav .btn{min-width:44px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd span{font-size:.72rem;color:var(--muted);text-align:center;padding:4px 0}
.cal-cell{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-height:78px;padding:5px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;overflow:hidden}
.cal-cell.blank{cursor:default}
.cal-cell:not(.blank):hover{border-color:var(--line)}
.cal-cell.past{opacity:.8}
.cal-cell.today{border-color:var(--amber);border-width:2px}
.cal-cell.sel{background:var(--bg)}
.cal-top{display:flex;justify-content:space-between;align-items:center}
.cal-top b{font-size:.9rem}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.full{background:var(--done)}.dot.part{background:var(--amber)}.dot.low{background:var(--miss)}
.chip{display:block;font-size:.66rem;line-height:1.25;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-monthly{background:var(--amber-soft);border-left:3px solid var(--amber)}
.chip-once{background:var(--ink);color:var(--bg)}
.chip-more,.routine{font-size:.64rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.routine{margin-top:auto}
.tag-done{background:var(--done)}
@media (max-width:430px){.cal-cell{min-height:64px;padding:3px}.chip{font-size:.6rem;padding:1px 2px}.routine{display:none}}
.why{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700}
input,select{font:inherit;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%;min-height:44px}
input.need{border-color:var(--miss)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.sec{font-family:var(--display);font-weight:600;font-size:1.55rem;margin:28px 0 10px}
.big{font-family:var(--display);font-weight:700;font-size:clamp(3.4rem,15vw,5rem);line-height:.9;margin-top:22px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75rem;line-height:1.15;background:var(--card);border:1px solid var(--line)}
.cell b{font-size:1rem}
.cell.full{background:var(--done);border-color:var(--done);color:#fff}
.cell.part{background:var(--amber-soft);border-color:var(--amber)}
.cell.low{background:var(--miss);border-color:var(--miss);color:#fff}
.cell.none{opacity:.35}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.misses{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.misses li{padding:12px 14px;border-top:1px solid var(--line)}
.misses li:first-child{border-top:0}
.clist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.cps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-weight:700;font-size:.85rem}
.form{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:16px;display:grid;gap:12px;margin-top:16px}
.form .sec{margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}
.error-line{color:var(--miss);font-weight:700;margin:0}
.foot{margin-top:36px;font-size:.85rem;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:608px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn-save{background:var(--amber);border-color:var(--amber);color:#1B1400;padding:10px 22px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--done);color:#fff;padding:8px 18px;border-radius:20px;font-weight:700;z-index:10}
@media (max-width:430px){
  .item{grid-template-columns:1fr}
  .item.sub{padding-left:22px}
  .item-actions .btn{flex:1}
  .cps,.row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login h1{font-family:var(--display);font-size:3rem;line-height:1;margin:0 0 6px}
.login form{display:grid;gap:12px;margin-top:20px}
.tools{display:grid;gap:10px;margin-top:6px}
.tools-row{display:flex;gap:8px}
.tools-row select{flex:1}
.status{font-size:.9rem;color:var(--muted);margin-top:6px}

/* ---------- Shell ---------- */
:root{--side-bg:#16203A;--side-ink:#E8ECF4;--amber-ink:#5A3F00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--side-bg:#0A1020;--amber-ink:#F2B632}}
:root[data-theme="dark"]{--side-bg:#0A1020;--amber-ink:#F2B632}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{--sbw:240px;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100vh}
.shell.collapsed{--sbw:76px}
.side{position:sticky;top:0;height:100vh;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;gap:6px;padding:16px 12px;overflow-y:auto;overflow-x:hidden;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 14px}
.brand-mark{flex:none;width:32px;height:32px;border-radius:8px;background:var(--amber);color:#1B1400;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.25rem}
.brand-name{font-family:var(--display);font-weight:700;font-size:1.35rem;white-space:nowrap;flex:1}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border:0;border-radius:9px;background:transparent;color:inherit;cursor:pointer;flex:none}
.icon-btn:hover{background:rgba(127,127,127,.15)}
.collapse-btn{opacity:.7}
.collapsed .collapse-btn svg{transform:rotate(180deg)}
.search{position:relative;margin-bottom:10px}
.search-ico{position:absolute;left:11px;top:12px;opacity:.65;pointer-events:none}
.search input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--side-ink);padding-left:40px;min-height:44px}
.search input::placeholder{color:rgba(232,236,244,.6)}
.search-results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(10,16,32,.28);max-height:60vh;overflow:auto;padding:6px;z-index:40}
.sr{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:0;border-radius:8px;padding:9px 10px;cursor:pointer}
.sr:hover,.sr:focus-visible{background:var(--bg)}
.sr span{font-size:.82rem;color:var(--muted)}
.sr-empty{margin:0;padding:10px;color:var(--muted);font-size:.9rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--side-ink);opacity:.78;font:inherit;font-weight:700;text-align:left;cursor:pointer;white-space:nowrap}
.nav-btn:hover{background:rgba(255,255,255,.08);opacity:1}
.nav-btn[aria-current="page"]{background:rgba(242,169,0,.16);opacity:1;box-shadow:inset 3px 0 0 var(--amber)}
.nav-btn svg{flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
@media (min-width:901px){
  .collapsed .label,.collapsed .search,.collapsed .brand-name{display:none}
  .collapsed .nav-btn{justify-content:center;padding:10px}
  .collapsed .brand{flex-direction:column}
}
.scrim{display:none}
.main{min-width:0;padding:22px 32px 120px}
.main .wrap{padding:0 0 40px;margin:0;max-width:680px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.tb-left{display:flex;align-items:center;gap:10px}
.page-title{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;margin:0}
.page-sub{color:var(--muted);margin:4px 0 0}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls select{width:auto;min-height:42px;padding:8px 12px}
.controls .btn{display:inline-flex;align-items:center;gap:8px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;color:var(--muted);margin-right:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--done)}
.sync.err i{background:var(--miss)}.sync.dirty i{background:var(--amber)}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);min-width:260px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(10,16,32,.22);padding:6px;z-index:20}
.menu-pop button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;font:inherit;font-weight:700;color:var(--ink);background:transparent;border:0;border-radius:8px;padding:10px 12px;cursor:pointer}
.menu-pop button:hover,.menu-pop button:focus-visible{background:var(--bg)}
.menu-pop span{font-weight:400;font-size:.82rem;color:var(--muted)}
.menu-btn{display:none}
.notice.ro{margin:0 0 18px}

/* ---------- Weekly progress ---------- */
:root{--g-health:#1F8A94;--g-money:#3A5BD9;--g-habits:#8A4FD1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g-health:#3CB7C2;--g-money:#6C8CF5;--g-habits:#B184F0}}
:root[data-theme="dark"]{--g-health:#3CB7C2;--g-money:#6C8CF5;--g-habits:#B184F0}
.wk{margin-bottom:16px}
.wk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}
.wk-head h2{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0}
.wk-num{display:flex;flex-direction:column;align-items:flex-end}
.wk-track{position:relative;padding-top:24px}
.wk-bar,.mini-bar{display:flex;width:100%;overflow:hidden;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.wk-bar{height:30px;border-radius:6px}
.seg{display:block;height:100%;min-width:2px}
.seg+.seg{box-shadow:inset 2px 0 0 var(--card)}
.wk-pace{position:absolute;top:0;bottom:-4px;transform:translateX(-1px);pointer-events:none}
.wk-pace i{position:absolute;top:18px;bottom:0;left:0;width:2px;background:var(--ink)}
.wk-pace b{position:absolute;top:0;left:0;transform:translateX(-50%);font-size:.72rem;white-space:nowrap;color:var(--muted)}
.wk-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.wk-legend{display:flex;gap:18px;flex-wrap:wrap;list-style:none;margin:0;padding:0;font-size:.9rem}
.wk-legend li{display:flex;align-items:center;gap:7px}
.wk-legend i{width:12px;height:12px;border-radius:3px;flex:none}
.wk-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hist{max-width:980px}
.hist-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:18px}
.hist-sum>div{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.hist-legend{margin-bottom:12px}
.hist-list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px}
.hist-row{display:grid;grid-template-columns:130px minmax(0,1fr) 84px;gap:16px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.hist-row:first-child{border-top:0}
.hist-row.cur{background:var(--bg)}
.hist-when{display:flex;flex-direction:column}
.mini-bar{height:14px;border-radius:4px}
.hist-num{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
@media (max-width:600px){
  .wk-head{flex-direction:column;align-items:flex-start}.wk-num{align-items:flex-start}
  .hist-sum{grid-template-columns:1fr 1fr}.hist-sum>div:last-child{grid-column:1/-1}
  .hist-row{grid-template-columns:1fr auto;gap:6px 12px;padding:12px 14px}.hist-row .mini-bar{grid-column:1/-1;grid-row:2}
}

/* ---------- Home ---------- */
.home{max-width:1240px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;cursor:pointer;min-width:0}
.kpi:hover{border-color:var(--ink)}
.kpi.alert{border-color:var(--miss);box-shadow:inset 4px 0 0 var(--miss)}
.kpi-label{font-size:.9rem;font-weight:700;color:var(--muted)}
.kpi-value{font-family:var(--display);font-weight:700;font-size:2.8rem;line-height:1}
.kpi-value small{font-size:1.1rem;font-weight:600;margin-left:4px;color:var(--muted)}
.kpi-value-sm{font-size:2.1rem}
.kpi-sub{font-size:.88rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:100%}
.up{color:var(--done);font-weight:700}.down{color:var(--miss);font-weight:700}
.row{display:grid;gap:16px;margin-top:16px}
.row-a{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.card-head h2{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0}
.small{font-size:.85rem}
.sub-h{font-size:.95rem;margin:18px 0 8px}
.fine{font-size:.8rem;color:var(--muted);margin:14px 0 0}
.empty{margin:4px 0;color:var(--muted)}
.chart-box{position:relative;height:250px}
.chart-fallback{color:var(--muted);font-size:.9rem}
.pill{display:inline-block;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill-good{background:var(--done-soft);color:var(--done)}
.pill-warn{background:var(--amber-soft);color:var(--amber-ink)}
.pill-bad{background:var(--miss-soft);color:var(--miss)}
.pill-none{background:var(--bg);color:var(--muted)}
.attn{list-style:none;margin:0;padding:0}
.attn li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.attn li:first-child{border-top:0}
.attn-head{font-size:.85rem;font-weight:700;color:var(--muted)}
.attn input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;margin:0;accent-color:var(--ink);flex:none;cursor:pointer}
.check{display:flex;align-items:center;gap:12px;cursor:pointer}
.attn .grow{flex:1;min-width:0}
.dotcol{flex:none;width:20px;height:6px;border-radius:3px}
.btn-sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.bulk b{margin-right:auto;padding-left:4px}
.bulk .btn{min-height:36px;padding:6px 12px}
.bulk .b-done{background:var(--done);border-color:var(--done);color:#fff}
.link-btn{background:transparent!important;border-color:transparent!important;color:inherit!important;text-decoration:underline}
.hstat{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.hrow{padding:7px 0}
.hrow-top{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.hbar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.hbar i{display:block;height:100%;border-radius:4px}
.tips{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.tips li{padding-left:12px;border-left:3px solid var(--amber);font-size:.95rem}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.time-btn{font:inherit;background:transparent;border:0;color:var(--muted);cursor:pointer;text-align:right;padding:0}
.time-btn time{font-size:.85rem;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--line)}
.tag{white-space:nowrap}
.tag-silent{background:var(--amber);color:#1B1400}
.why-ro{grid-column:1/-1;margin:0;font-size:.9rem;color:var(--muted)}
.grid .cell{font:inherit;color:inherit;cursor:pointer}
.dd-h{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,16,32,.5);display:grid;place-items:center;padding:16px;z-index:50}
.dialog{background:var(--card);color:var(--ink);border-radius:16px;width:100%;max-width:560px;max-height:85vh;overflow:auto;padding:20px 22px;box-shadow:0 24px 64px rgba(10,16,32,.35)}
.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.dialog-head h2{font-family:var(--display);font-weight:600;font-size:1.6rem;margin:0}
.help dt{font-weight:700;margin-top:12px}.help dd{margin:4px 0 0;color:var(--muted)}
.bulk-list{margin:0 0 14px;padding-left:18px}
.b-miss-solid{background:var(--miss);border-color:var(--miss);color:#fff}

/* ---------- Loading ---------- */
.skel-page{max-width:1240px;margin:0 auto;padding:32px}
.skel{border-radius:14px;background:linear-gradient(90deg,var(--line) 25%,var(--card) 50%,var(--line) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.skel-title{height:40px;width:220px;margin-bottom:24px}
.skel-kpi{height:118px}
.skel-card{height:280px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.login .card{margin-top:16px}

/* ---------- Responsive ---------- */
@media (max-width:1150px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.row-a{grid-template-columns:1fr}}
@media (max-width:900px){
  .shell,.shell.collapsed{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;height:auto;transform:translateX(-100%);transition:transform .2s ease;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .nav-open .side{transform:none}
  .nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,16,32,.45);z-index:25}
  .collapse-btn{display:none}
  .menu-btn{display:inline-grid;margin-left:-8px}
  .main{padding:14px 16px 120px}
  .page-title{font-size:2rem}
  .controls{width:100%}
  .controls select{flex:1;min-width:0}
}
@media (max-width:480px){.kpis{gap:10px}.kpi{padding:14px}.kpi-value{font-size:2.2rem}.kpi-value-sm{font-size:1.6rem}.card{padding:16px}.feed li{grid-template-columns:auto minmax(0,1fr)}.feed .time-btn{grid-column:2;text-align:left}}
@media (min-width:901px){.bar{left:var(--sbw)}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.side{transition:none}}
@media print{
  .side,.controls,.bar,.scrim,.menu-btn,.toast,.overlay{display:none!important}
  .shell{display:block}.main{padding:0}
  body{background:#fff}
  .card,.kpi{break-inside:avoid;border-color:#ccc}
}

<body>
<div id="app"></div>
<script>(function(){
'use strict';
var app=document.getElementById('app');
var params=new URLSearchParams(location.search);
var viewToken=params.get('view')||'';
var readOnly=!!viewToken;

var state=null, readToken='', tab='home', editing=null, editErr='', dirty=false, saving=false, barErr='', notice='', toast='', toolMsg='';
var calMonth='', calSel='';
var range=7, catFilter='all', selected={}, feedAll=false, modal=null, menuOpen=false, navOpen=false, query='';
var lastSync=0, syncErr=false, loadErr='', charts={};
var collapsed=false; try{collapsed=localStorage.getItem('dbd-collapsed')==='1';}catch(e){}

var SLOTS=['morning','midday','evening'];
var SLOT_NAME={morning:'Morning',midday:'Midday',evening:'Evening'};
var TIER={device:'Claude checks Apple Health',paper:'Claude checks statements',word:'On your word'};
var TIER_OPT={device:'Apple Health (Claude checks)',paper:'Statement or receipt (Claude checks)',word:'Your word only'};
var CAT={device:'Health',paper:'Money',word:'Habits'};
var CAT_KEYS=['device','paper','word'];
var FREQ_OPT={daily:'Every day',weekdays:'Weekdays',monthly:'Monthly',once:'One time'};
var NEEDS_WHY={missed:1,bypassed:1};
var STATUS_LBL={done:'Done',missed:'Missed',bypassed:'Bypassed'};
var TITLES={home:'Home',today:'Today',cal:'Calendar',score:'Scorecard',progress:'Progress history',commitments:'Commitments'};
var CAT_VAR={device:'--g-health',paper:'--g-money',word:'--g-habits'};

function ico(p){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';}
var I={
  home:ico('<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>'),
  today:ico('<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'),
  cal:ico('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  score:ico('<path d="M5 20V11M11 20V5M17 20v-6M3 20h18"/>'),
  list:ico('<path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>'),
  help:ico('<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01"/>'),
  out:ico('<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"/>'),
  search:ico('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  menu:ico('<path d="M3 6h18M3 12h18M3 18h18"/>'),
  chev:ico('<path d="m15 6-6 6 6 6"/>'),
  dl:ico('<path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>'),
  close:ico('<path d="M6 6l12 12M18 6 6 18"/>'),
  prog:ico('<rect x="3" y="9" width="18" height="6" rx="1"/><path d="M9 9v6M14 9v6"/>')
};

/* ---------- Helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function now(){
  var f=new Intl.DateTimeFormat('en-US',{timeZone:state.settings.tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  var p={};f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
  var h=(+p.hour)%24;
  return {key:p.year+'-'+p.month+'-'+p.day,mins:h*60+(+p.minute),hhmm:String(h).padStart(2,'0')+':'+p.minute};
}
function toMins(t){var a=t.split(':').map(Number);return a[0]*60+a[1];}
function fmt12(t){var a=t.split(':').map(Number),h=a[0],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(a[1]).padStart(2,'0')+' '+ap;}
function parseKey(k){var a=k.split('-').map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2]));}
function addDays(k,n){var d=parseKey(k);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function fmtDate(k,long){return parseKey(k).toLocaleDateString('en-US',long?{timeZone:'UTC',weekday:'long',month:'long',day:'numeric'}:{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function occurs(c,k){
  if(c.since&&k<c.since)return false;
  var d=parseKey(k),wd=d.getUTCDay();
  if(c.freq==='once')return !!c.date&&c.date===k;
  if(c.freq==='daily')return true;
  if(c.freq==='weekdays')return wd>=1&&wd<=5;
  if(c.freq==='monthly'){if(!c.day)return false;var last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();return d.getUTCDate()===Math.min(c.day,last);}
  return false;
}
function entry(k,id){return (state.log[k]||{})[id];}
function setEntry(k,id,val){state.log[k]=state.log[k]||{};if(val)state.log[k][id]=val;else delete state.log[k][id];if(!Object.keys(state.log[k]).length)delete state.log[k];dirty=true;}
function units(c){return (c.parts&&c.parts.length)?c.parts.map(function(p){return {key:c.id+'.'+p.id,title:p.title,c:c,sub:true};}):[{key:c.id,title:c.title,c:c,sub:false}];}
function unitsOn(k){var u=[];state.commitments.forEach(function(c){if(occurs(c,k))u=u.concat(units(c));});return u;}
function findUnit(key){var a=key.split('.'),c=state.commitments.filter(function(x){return x.id===a[0];})[0];if(!c)return null;var us=units(c);return us.filter(function(u){return u.key===key;})[0]||null;}
function unitTitle(key){var a=key.split('.'),c=state.commitments.filter(function(x){return x.id===a[0];})[0];if(!c)return '(deleted commitment)';
  if(a.length<2)return c.title;var pt=(c.parts||[]).filter(function(x){return x.id===a[1];})[0];return c.title+': '+(pt?pt.title:'(deleted part)');}
function fullTitle(u){return (u.sub?u.c.title+': ':'')+u.title;}
function catOk(u){return catFilter==='all'||u.c.tier===catFilter;}
function isSpecial(c){return c.freq==='monthly'||c.freq==='once';}
function freqText(c){if(c.freq==='once')return c.date?'One time on '+fmtDate(c.date):'One time, date not set';if(c.freq==='monthly')return c.day?'Monthly on the '+ord(c.day):'Monthly, due day not set';return FREQ_OPT[c.freq];}
function isPast(k,u,n){return k<n.key||(k===n.key&&toMins(state.settings.checkpoints[u.c.slot])<=n.mins);}
function tagHTML(s){return '<span class="tag tag-'+s+'">'+(STATUS_LBL[s]||'Never marked')+'</span>';}
function ago(t){var m=Math.round((Date.now()-t)/60000);return m<1?'just now':m===1?'1 min ago':m<60?m+' min ago':Math.round(m/60)+' hr ago';}

/* ---------- Scoring ---------- */
function dayScore(k,n){
  var us=unitsOn(k).filter(catOk);
  if(!us.length)return null;
  var r={done:0,missed:0,silent:0,open:0,bypassed:0};
  us.forEach(function(u){var e=entry(k,u.key);
    if(e&&e.s==='done')r.done++;else if(e&&e.s==='missed')r.missed++;else if(e&&e.s==='bypassed')r.bypassed++;
    else if(isPast(k,u,n))r.silent++;else r.open++;});
  r.counted=r.done+r.missed+r.silent;return r;
}
function periodStats(endKey,days,n){
  var t={done:0,missed:0,silent:0,bypassed:0,counted:0};
  for(var i=days-1;i>=0;i--){var s=dayScore(addDays(endKey,-i),n);if(s){t.done+=s.done;t.missed+=s.missed;t.silent+=s.silent;t.bypassed+=s.bypassed;t.counted+=s.counted;}}
  t.pct=t.counted?Math.round(t.done/t.counted*100):null;return t;
}
function streaks(n){
  var cur=0,best=0,run=0,counting=true;
  var ts=dayScore(n.key,n),todayFull=ts&&ts.counted&&ts.done===ts.counted&&!ts.open;
  for(var i=1;i<=120;i++){
    var s=dayScore(addDays(n.key,-i),n);
    if(!s||!s.counted){continue;}
    if(s.done===s.counted){run++;if(counting)cur++;}else{counting=false;best=Math.max(best,run);run=0;}
  }
  best=Math.max(best,run);
  if(todayFull){cur++;best=Math.max(best,cur);}
  return {cur:cur,best:best};
}

/* ---------- API ---------- */
function api(method,url,body){
  return fetch(url,{method:method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null;}catch(e){}return {status:r.status,ok:r.ok,data:j};});});
}
function load(quiet){
  if(!state&&!quiet)renderSkeleton();
  var url=readOnly?'/api/state?token='+encodeURIComponent(viewToken):'/api/state';
  return api('GET',url).then(function(r){
    if(r.status===401){
      if(readOnly){loadErr='This view-only link isn\u2019t valid anymore. Ask for a new one.';renderError(false);return;}
      state=null;renderLogin('');return;
    }
    if(!r.ok){if(state){syncErr=true;renderSync();return;}loadErr=(r.data&&r.data.error)||('The server returned an error ('+r.status+').');renderError(true);return;}
    lastSync=Date.now();syncErr=false;loadErr='';
    if(state&&dirty){renderSync();return;}
    state=r.data.state;if(r.data.readToken)readToken=r.data.readToken;
    render();
  },function(){
    if(state){syncErr=true;renderSync();return;}
    loadErr='Can\u2019t reach the server. Check your connection, then retry.';renderError(true);
  });
}
function save(){
  if(readOnly)return;
  var bad=false;
  Object.keys(state.log).forEach(function(k){Object.keys(state.log[k]).forEach(function(id){var e=state.log[k][id];if(NEEDS_WHY[e.s]&&!String(e.why||'').trim())bad=true;});});
  if(bad){barErr='Give a reason for every miss and bypass before saving.';render();return;}
  saving=true;barErr='';renderBar();
  api('PUT','/api/state',{state:state,rev:state.rev||0}).then(function(r){
    saving=false;
    if(r.ok){state=r.data.state;dirty=false;lastSync=Date.now();flash('Saved');return;}
    if(r.status===409){state=r.data.state;dirty=false;notice='Something was saved from an email button while you were editing. This is the latest. Redo your change.';render();return;}
    if(r.status===401){renderLogin('Your session ended. Sign in again, then redo your change.');return;}
    barErr='Save failed: '+(r.data&&r.data.error||r.status);render();
  },function(){saving=false;barErr='Save failed. Check your connection.';render();});
}
function flash(m){toast=m;render();setTimeout(function(){toast='';var t=document.querySelector('.toast');if(t)t.remove();},2000);}

/* ---------- System states ---------- */
function renderSkeleton(){
  app.innerHTML='<div class="skel-page" aria-busy="true" aria-label="Loading"><div class="skel skel-title"></div>'+
    '<div class="kpis">'+[1,2,3,4].map(function(){return '<div class="skel skel-kpi"></div>';}).join('')+'</div>'+
    '<div class="row row-a"><div class="skel skel-card"></div><div class="skel skel-card"></div></div></div>';
}
function renderError(canRetry){
  app.innerHTML='<div class="login"><h1>Day by Datum</h1><div class="card"><p class="error-line">'+esc(loadErr)+'</p>'+
    (canRetry?'<button class="btn b-primary btn-wide" data-retry>Try again</button>':'')+'</div></div>';
}
function renderLogin(msg){
  app.innerHTML='<div class="login"><h1>Day by Datum</h1><p class="muted">Sign in to check in.</p>'+
    '<form id="login"><input type="password" name="password" autocomplete="current-password" placeholder="Password" required aria-label="Password">'+
    (msg?'<p class="error-line">'+esc(msg)+'</p>':'')+'<button class="btn b-primary" type="submit">Sign in</button></form></div>';
  document.getElementById('login').addEventListener('submit',function(ev){
    ev.preventDefault();
    api('POST','/api/login',{password:ev.target.password.value}).then(function(r){
      if(r.ok)load();else renderLogin(r.data&&r.data.error||'Sign-in failed.');
    });
  });
}

/* ---------- Home ---------- */
function healthData(n){
  var map={},order=[];
  for(var i=range-1;i>=0;i--){var dk=addDays(n.key,-i);
    unitsOn(dk).forEach(function(u){
      if(u.c.tier!=='device')return;
      var m=map[u.key];if(!m){m=map[u.key]={u:u,done:0,missed:0,silent:0,byp:0};order.push(u.key);}
      var e=entry(dk,u.key);
      if(e&&e.s==='done')m.done++;else if(e&&e.s==='missed')m.missed++;else if(e&&e.s==='bypassed')m.byp++;else if(isPast(dk,u,n))m.silent++;
    });}
  return order.map(function(k){var m=map[k];m.counted=m.done+m.missed+m.silent;m.rate=m.counted?m.done/m.counted:null;return m;});
}
function tipFor(title){
  var t=title.toLowerCase();
  if(/sleep|slept|bed|rest/.test(t))return 'Set a wind-down alarm 45 minutes before bed, and charge your phone outside the bedroom.';
  if(/step|walk/.test(t))return 'Add a 10-minute walk right after lunch. It closes about a third of a 10,000-step gap.';
  if(/exercise|workout|gym|train|run/.test(t))return 'Put the workout on your calendar with a start time. A slot beats an intention.';
  if(/water|hydrat/.test(t))return 'Keep a full bottle where you work and refill it at each checkpoint.';
  return 'Move it to a checkpoint where you actually have time, or shrink the target until it sticks.';
}
function healthCard(n){
  var hd=healthData(n);
  var tot={done:0,counted:0,silent:0};hd.forEach(function(m){tot.done+=m.done;tot.counted+=m.counted;tot.silent+=m.silent;});
  var pct=tot.counted?Math.round(tot.done/tot.counted*100):null;
  var pill=pct==null?['pill-none','No data yet']:pct>=85?['pill-good','On track']:pct>=60?['pill-warn','Slipping']:['pill-bad','Off track'];
  var h='<section class="card" aria-labelledby="h-health"><div class="card-head"><h2 id="h-health">Health</h2><span class="pill '+pill[0]+'">'+pill[1]+'</span></div>';
  if(!hd.length)return h+'<p class="empty">No health commitments yet. Add one tagged Apple Health.</p></section>';
  h+='<div class="hstat"><span class="kpi-value">'+(pct==null?'\u2014':pct+'%')+'</span><span class="muted">of health check-ins done, last '+range+' days</span></div>';
  hd.forEach(function(m){
    var r=m.rate==null?null:Math.round(m.rate*100),col=r==null?'var(--line)':r>=85?'var(--done)':r>=60?'var(--amber)':'var(--miss)';
    h+='<div class="hrow"><div class="hrow-top"><span>'+esc(fullTitle(m.u))+'</span><span class="muted">'+(m.counted?m.done+' of '+m.counted:'not due yet')+'</span></div>'+
      '<div class="hbar" role="img" aria-label="'+(r==null?'No data':r+'% done')+'"><i style="width:'+(r||0)+'%;background:'+col+'"></i></div></div>';
  });
  var tips=[];
  hd.filter(function(m){return m.counted>=2&&m.rate<0.7;}).sort(function(a,b){return a.rate-b.rate;}).slice(0,2).forEach(function(m){
    tips.push('<b>'+esc(fullTitle(m.u))+'</b> is at '+m.done+' of '+m.counted+'. '+tipFor(m.u.title));});
  if(tot.silent>=2)tips.push('You left '+tot.silent+' health check-ins unanswered. An honest Missed is better than silence.');

/* ---------- Weekly progress ---------- */
function weekStart(k){var d=parseKey(k),off=(d.getUTCDay()+6)%7;return addDays(k,-off);}
function weekLabel(ws){
  var a=parseKey(ws),b=parseKey(addDays(ws,6)),o={timeZone:'UTC',month:'short',day:'numeric'};
  var la=a.toLocaleDateString('en-US',o),lb=a.getUTCMonth()===b.getUTCMonth()?String(b.getUTCDate()):b.toLocaleDateString('en-US',o);
  return la+'\u2013'+lb;
}
// Capacity = every task scheduled that week, minus bypasses. Only Done fills the bar.
function weekStats(ws,n){
  var w={total:0,done:0,pace:0,cat:{}};
  CAT_KEYS.forEach(function(c){w.cat[c]={total:0,done:0};});
  for(var i=0;i<7;i++){var dk=addDays(ws,i);
    unitsOn(dk).forEach(function(u){var e=entry(dk,u.key);
      if(e&&e.s==='bypassed')return;
      var c=w.cat[u.c.tier];w.total++;c.total++;
      if(e&&e.s==='done'){w.done++;c.done++;}
      if(isPast(dk,u,n))w.pace++;
    });}
  w.pct=w.total?Math.round(w.done/w.total*100):null;
  return w;
}
function segBar(w,cls){
  var segs=CAT_KEYS.map(function(c){var v=w.total?w.cat[c].done/w.total*100:0;
    return v?'<span class="seg" style="width:'+v.toFixed(2)+'%;background:var('+CAT_VAR[c]+')" title="'+CAT[c]+': '+w.cat[c].done+' done"></span>':'';}).join('');
  var label=(w.pct==null?'Nothing scheduled':w.pct+'% filled, '+w.done+' of '+w.total+' done. ')+CAT_KEYS.map(function(c){return CAT[c]+' '+w.cat[c].done+' of '+w.cat[c].total;}).join(', ');
  return '<div class="'+cls+'" role="img" aria-label="'+esc(label)+'">'+segs+'</div>';
}
function weekCard(n){
  var ws=weekStart(n.key),w=weekStats(ws,n);
  var pacePct=w.total?Math.round(w.pace/w.total*100):0,diff=(w.pct||0)-pacePct;
  var paceTxt=!w.total?'':w.pace===0?'Week just started':diff>=0?'<span class="up">Ahead of pace by '+diff+' pts</span>':'<span class="down">Behind pace by '+Math.abs(diff)+' pts</span>';
  var h='<section class="card wk" aria-labelledby="h-wk"><div class="wk-head"><div><h2 id="h-wk">This week</h2><span class="muted small">'+weekLabel(ws)+'. Only completed tasks fill the bar</span></div>'+
    '<div class="wk-num"><span class="kpi-value">'+(w.pct==null?'\u2014':w.pct+'%')+'</span><span class="muted small">'+w.done+' of '+w.total+' done</span></div></div>';
  h+='<div class="wk-track">'+segBar(w,'wk-bar')+(w.total&&w.pace?'<span class="wk-pace" style="left:'+pacePct+'%" title="Where you\u2019d be if you were caught up"><i></i><b>On pace: '+pacePct+'%</b></span>':'')+'</div>';
  h+='<div class="wk-foot"><ul class="wk-legend">'+CAT_KEYS.map(function(c){var x=w.cat[c];
    return '<li><i style="background:var('+CAT_VAR[c]+')"></i><b>'+CAT[c]+'</b><span class="muted">'+x.done+' of '+x.total+'</span></li>';}).join('')+'</ul>'+
    '<div class="wk-right">'+(paceTxt?'<span class="small">'+paceTxt+'</span>':'')+'<button class="link" data-tab="progress">See progress history</button></div></div></section>';
  return h;
}
function viewHistory(){
  var n=now(),cur=weekStart(n.key),first=null;
  state.commitments.forEach(function(c){if(c.since&&(!first||c.since<first))first=c.since;});
  var startWk=weekStart(first||n.key),weeks=[];
  for(var ws=cur;ws>=startWk&&weeks.length<52;ws=addDays(ws,-7))weeks.push(ws);
  var stats=weeks.map(function(ws){return {ws:ws,w:weekStats(ws,n)};});
  var done=stats.filter(function(x){return x.ws!==cur&&x.w.total;});
  var best=done.reduce(function(b,x){return !b||x.w.pct>b.w.pct?x:b;},null);
  var avg=done.length?Math.round(done.reduce(function(a,x){return a+x.w.pct;},0)/done.length):null;
  var h='<div class="hist">';
  h+='<div class="hist-sum"><div><span class="kpi-label">Weeks tracked</span><span class="kpi-value">'+weeks.length+'</span></div>'+
    '<div><span class="kpi-label">Average fill</span><span class="kpi-value">'+(avg==null?'\u2014':avg+'%')+'</span>'+(avg==null?'<span class="muted small">After your first full week</span>':'')+'</div>'+
    '<div><span class="kpi-label">Best week</span><span class="kpi-value">'+(best?best.w.pct+'%':'\u2014')+'</span>'+(best?'<span class="muted small">'+weekLabel(best.ws)+'</span>':'')+'</div></div>';
  h+='<ul class="wk-legend hist-legend">'+CAT_KEYS.map(function(c){return '<li><i style="background:var('+CAT_VAR[c]+')"></i><b>'+CAT[c]+'</b></li>';}).join('')+'<li class="muted">Empty track is unfinished work</li></ul>';
  h+='<ol class="hist-list">'+stats.map(function(x){var w=x.w,isCur=x.ws===cur;
    return '<li class="hist-row'+(isCur?' cur':'')+'"><div class="hist-when"><b>'+weekLabel(x.ws)+'</b>'+(isCur?'<span class="muted small">In progress</span>':'')+'</div>'+
      segBar(w,'mini-bar')+'<div class="hist-num"><b>'+(w.pct==null?'\u2014':w.pct+'%')+'</b><span class="muted small">'+w.done+'/'+w.total+'</span></div></li>';}).join('')+'</ol>';
  if(weeks.length<2)h+='<p class="muted" style="margin-top:14px">Your history starts here. A new bar appears every Monday.</p>';
  return h+'</div>';
}

/* ---------- Today ---------- */

  var notes=[];

  function row(u){

    var btn=function(act,label,cls){return '<button class="btn '+cls+'" data-act="'+act+'" data-id="'+u.key+'" aria-pressed="'+(s2===act)+'">'+label+'</button>';};
    var actions=readOnly?(s2?tagHTML(s2):(lt?tagHTML('silent'):'')):btn('done','Done','b-done')+btn('missed','Missed','b-miss')+btn('bypassed','Bypass','b-byp');
    return '<li class="item'+(u.sub?' sub':'')+(s2?' '+s2:(lt?' overdue':''))+'"><div><span class="item-title">'+esc(u.title)+'</span>'+
      (metaLine?'<span class="item-meta">'+metaLine+'</span>':'')+'</div><div class="item-actions">'+actions+'</div>'+
      (NEEDS_WHY[s2]&&!readOnly?'<label class="why">'+(s2==='missed'?'Why did you miss it?':'Why bypass it?')+'<input data-why="'+u.key+'" value="'+esc(e.why||'')+'" placeholder="Be specific. No \u201cjust didn\u2019t.\u201d"'+(String(e.why||'').trim()?'':' class="need"')+'></label>':'')+
      (NEEDS_WHY[s2]&&readOnly&&e.why?'<p class="why-ro">\u201c'+esc(e.why)+'\u201d</p>':'')+'</li>';
  }
  SLOTS.forEach(function(s){
    var list=comms.filter(function(c){return c.slot===s;});
    if(!list.length)return;
    var su=us.filter(function(u){return u.c.slot===s;});
    var passed=toMins(cps[s])<=n.mins,lateN=su.filter(isLate).length;
    h+='<section class="slot"><div class="slot-head"><h2>'+SLOT_NAME[s]+'</h2><span'+(lateN?' class="bad-text"':'')+'>'+
      (lateN?lateN+' overdue since '+fmt12(cps[s]):(passed?'Was due '+fmt12(cps[s]):'Due by '+fmt12(cps[s])))+'</span></div><ul class="items">';
    list.forEach(function(c){
      var uu=units(c);
      if(uu[0].sub)h+='<li class="item group"><div><span class="item-title">'+esc(c.title)+'</span><span class="item-meta">'+TIER[c.tier]+(c.amount?', '+esc(c.amount):'')+'</span></div></li>';
      uu.forEach(function(u){h+=row(u);});
    });
    h+='</ul></section>';
  });
  if(!comms.length)h+='<p class="muted" style="margin-top:24px">Nothing is scheduled for today.</p>';
  h+='<p class="foot">Anything not marked by its checkpoint counts as missed. Bypasses don\u2019t count against you, but they stay on your record.</p>';
  return h;
}

/* ---------- Calendar ---------- */
function dayDetail(k2){
  var n=now(),us=unitsOn(k2),h='';
  if(!us.length)return '<p class="muted">Nothing scheduled.</p>';
  SLOTS.forEach(function(s){
    var su=us.filter(function(u){return u.c.slot===s;});
    if(!su.length)return;
    h+='<div class="slot-head"><h3 class="dd-h">'+SLOT_NAME[s]+'</h3><span>by '+fmt12(state.settings.checkpoints[s])+'</span></div><ul class="clist" style="margin-bottom:14px">';
    su.forEach(function(u){
      var e=entry(k2,u.key),stt=e&&e.s;
      var tag=stt?tagHTML(stt):(isPast(k2,u,n)?tagHTML('silent'):'');
      h+='<li class="crow"><div><span class="item-title">'+esc(fullTitle(u))+'</span><span class="item-meta">'+CAT[u.c.tier]+'. '+(isSpecial(u.c)?freqText(u.c)+(u.c.amount?', '+esc(u.c.amount):''):FREQ_OPT[u.c.freq])+
        (e&&e.why?'. \u201c'+esc(e.why)+'\u201d':'')+'</span></div>'+tag+'</li>';
    });
    h+='</ul>';
  });
  if(k2===n.key&&!readOnly)h+='<button class="btn btn-wide" data-tab="today">Check in on Today</button>';
  return h;
}
function viewCal(){
  var n=now(),today=n.key;
  if(!calMonth)calMonth=today.slice(0,7);
  if(!calSel)calSel=today;
  var ym=calMonth.split('-').map(Number),y=ym[0],m=ym[1];
  var first=new Date(Date.UTC(y,m-1,1)),lead=first.getUTCDay(),days=new Date(Date.UTC(y,m,0)).getUTCDate();
  var title=first.toLocaleDateString('en-US',{timeZone:'UTC',month:'long',year:'numeric'});
  var h='<div class="cal-head"><h2 class="sec">'+title+'</h2><div class="cal-nav">'+
    '<button class="btn" data-cal="-1" aria-label="Previous month">\u2039</button>'+
    (calMonth!==today.slice(0,7)?'<button class="btn" data-caltoday>Today</button>':'')+
    '<button class="btn" data-cal="1" aria-label="Next month">\u203a</button></div></div>';
  h+='<div class="cal"><div class="cal-wd" aria-hidden="true">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){return '<span>'+d+'</span>';}).join('')+'</div><div class="cal-grid">';
  for(var i=0;i<lead;i++)h+='<span class="cal-cell blank"></span>';
  for(var d=1;d<=days;d++){
    var k=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var comms=state.commitments.filter(function(c){return occurs(c,k)&&(catFilter==='all'||c.tier===catFilter);});
    var special=comms.filter(isSpecial),routine=comms.length-special.length;
    var dot='';
    if(k<=today){var sc=dayScore(k,n);if(sc&&sc.counted){var r=sc.done/sc.counted;dot=r>=1?'full':(r>=.7?'part':'low');}}
    var cls='cal-cell'+(k===today?' today':'')+(k===calSel?' sel':'')+(k<today?' past':'');
    h+='<button class="'+cls+'" data-day="'+k+'" aria-label="'+fmtDate(k,true)+'"><span class="cal-top"><b>'+d+'</b>'+(dot?'<i class="dot '+dot+'"></i>':'')+'</span>'+
      special.slice(0,2).map(function(c){return '<span class="chip chip-'+c.freq+'">'+esc(c.title)+'</span>';}).join('')+
      (special.length>2?'<span class="chip-more">+'+(special.length-2)+' more</span>':'')+
      (routine?'<span class="routine">'+routine+' routine</span>':'')+'</button>';
  }
  h+='</div></div><div class="legend"><span><i style="background:var(--amber)"></i>Monthly</span><span><i style="background:var(--ink)"></i>One time</span><span>Dots show how that day went</span></div>';
  h+='<h2 class="sec" id="cal-detail">'+fmtDate(calSel,true)+'</h2>'+dayDetail(calSel);
  return h;
}

/* ---------- Scorecard ---------- */
function viewScore(){
  var n=now(),k=n.key,h='',tot=periodStats(k,range,n);
  h+='<div class="big">'+(tot.pct==null?'No data':tot.pct+'%')+'</div><p class="muted" style="margin:6px 0 0">'+(tot.pct==null?'Your first checkpoint hasn\u2019t passed yet.':'done over the last '+range+' days'+(catFilter!=='all'?', '+CAT[catFilter]+' only':''))+'</p>';
  if(tot.counted||tot.bypassed)h+='<div class="stats" style="margin-top:12px"><span>'+tot.done+' done</span><span class="bad-text">'+tot.missed+' missed</span><span class="bad-text">'+tot.silent+' never marked</span><span class="muted">'+tot.bypassed+' bypassed</span></div>';
  h+='<h2 class="sec">Last 14 days</h2><div class="grid">';
  for(var j=13;j>=0;j--){
    var dk=addDays(k,-j),sc=dayScore(dk,n),d=parseKey(dk),cls='none',lbl='';
    if(sc&&sc.counted){var r=sc.done/sc.counted;cls=r>=1?'full':(r>=.7?'part':'low');lbl=Math.round(r*100)+'%';}else if(sc){cls='';lbl=sc.bypassed?'bypass':'open';}
    h+='<button class="cell '+cls+'" data-openday="'+dk+'" aria-label="'+fmtDate(dk,true)+(lbl?', '+lbl:'')+'"><span>'+d.toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short'})+'</span><b>'+d.getUTCDate()+'</b><span>'+lbl+'</span></button>';
  }
  h+='</div><div class="legend"><span><i style="background:var(--done)"></i>All done</span><span><i style="background:var(--amber)"></i>70% or more</span><span><i style="background:var(--miss)"></i>Under 70%</span></div>';
  var rows=[],bypCount={};
  for(var m=0;m<14;m++){var mk=addDays(k,-m),lg=state.log[mk]||{};
    Object.keys(lg).forEach(function(key){var e=lg[key],u=findUnit(key);if(u&&!catOk(u))return;if(NEEDS_WHY[e.s]){rows.push({k:mk,t:unitTitle(key),s:e.s,why:e.why});if(e.s==='bypassed')bypCount[key]=(bypCount[key]||0)+1;}});}
  var habit=Object.keys(bypCount).filter(function(x){return bypCount[x]>=3;});
  h+='<h2 class="sec">Misses, bypasses and your reasons</h2>';
  if(habit.length)h+='<div class="notice"><p>Bypassed 3+ times in two weeks: '+habit.map(function(x){return '<b>'+esc(unitTitle(x))+'</b>';}).join(', ')+'. Either it\u2019s the wrong commitment or it\u2019s an excuse. Decide which.</p></div>';
  h+=rows.length?'<ul class="misses">'+rows.map(function(x){return '<li>'+tagHTML(x.s)+' <b>'+esc(x.t)+'</b> <span class="muted">'+fmtDate(x.k)+'</span><br>'+esc(x.why||'No reason given')+'</li>';}).join('')+'</ul>':'<p class="muted">Nothing missed or bypassed in the last 14 days.</p>';
  return h;
}

/* ---------- Export ---------- */
function exportCSV(){
  var n=now(),cps=state.settings.checkpoints,rows=[['Date','Item','Category','Checkpoint','Status','Reason','Marked at','Via']];
  for(var i=range-1;i>=0;i--){var dk=addDays(n.key,-i);
    unitsOn(dk).filter(catOk).forEach(function(u){var e=entry(dk,u.key);
      var stt=e?(STATUS_LBL[e.s]||e.s):(isPast(dk,u,n)?'Never marked':'Open');
      rows.push([dk,fullTitle(u),CAT[u.c.tier],SLOT_NAME[u.c.slot],stt,e&&e.why||'',e&&e.at||'',e&&e.via||'']);});}
  var cell=function(v){v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  var csv=rows.map(function(r){return r.map(cell).join(',');}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='day-by-datum_'+n.key+'_last-'+range+'-days'+(catFilter!=='all'?'_'+CAT[catFilter].toLowerCase():'')+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}

/* ---------- Search ---------- */
function searchResults(q){
  q=q.trim().toLowerCase();if(!q)return [];
  var out=[];
  state.commitments.forEach(function(c){
    var hay=(c.title+' '+(c.parts||[]).map(function(p){return p.title;}).join(' ')).toLowerCase();
    if(hay.indexOf(q)>-1)out.push({kind:'c',id:c.id,title:c.title,sub:CAT[c.tier]+'. '+freqText(c)});
  });
  var n=now();
  for(var i=0;i<90;i++){var dk=addDays(n.key,-i),lg=state.log[dk]||{};
    Object.keys(lg).forEach(function(key){var e=lg[key],t=unitTitle(key);
      if((e.why||'').toLowerCase().indexOf(q)>-1||t.toLowerCase().indexOf(q)>-1&&NEEDS_WHY[e.s])out.push({kind:'d',k:dk,title:t,sub:(STATUS_LBL[e.s]||'')+' '+fmtDate(dk)+(e.why?': \u201c'+e.why+'\u201d':'')});});}
  return out.slice(0,12);
}
function renderSearch(){
  var box=document.getElementById('search-results');if(!box)return;
  if(!query.trim()){box.hidden=true;box.innerHTML='';return;}
  var r=searchResults(query);box.hidden=false;
  box.innerHTML=r.length?r.map(function(x){
    return '<button class="sr" '+(x.kind==='c'?(readOnly?'data-tab="cal"':'data-edit-go="'+x.id+'"'):'data-openday="'+x.k+'"')+'><b>'+esc(x.title)+'</b><span>'+esc(x.sub)+'</span></button>';
  }).join(''):'<p class="sr-empty">No matches for \u201c'+esc(query)+'\u201d.</p>';
}

    (toast?'<div class="toast" role="status">'+esc(toast)+'</div>':'');
  if(query)renderSearch();
  drawCharts();
  if(modal){var c=app.querySelector('.dialog [data-closemodal]');var ta=document.getElementById('bulkwhy');(ta||c)&&(ta||c).focus();}
}
function readForm(){
  var f=document.getElementById('form');if(!f)return;
  f.querySelectorAll('[data-f]').forEach(function(el){var key=el.getAttribute('data-f'),v=el.value;
    if(key==='day'){var num=parseInt(v,10);editing.day=isNaN(num)?null:num;}
    else if(key==='partsText'){var old=editing.parts||[];editing.parts=v.split('\n').map(function(x){return x.trim();}).filter(Boolean).map(function(t){
      var hit=old.filter(function(p){return p.title===t;})[0];return hit||{id:'p'+Math.random().toString(36).slice(2,7),title:t};});}
    else editing[key]=v;});
}
function goEdit(id){var c=state.commitments.filter(function(x){return x.id===id;})[0];if(!c)return;tab='commitments';editErr='';editing=JSON.parse(JSON.stringify(c));query='';modal=null;navOpen=false;render();window.scrollTo(0,0);}

/* ---------- Events ---------- */
app.addEventListener('click',function(ev){
  if(ev.target.closest('[data-retry]')){load();return;}
  if(!state)return;
  var t=ev.target.closest('button,[data-closemodal],[data-closenav]');
  if(menuOpen&&!ev.target.closest('.menu')){menuOpen=false;render();if(!t)return;}
  if(!t)return;
  if(t.classList.contains('overlay')&&ev.target!==t)return;
  var k=now().key;
  if(t.hasAttribute('data-closemodal')){modal=null;render();return;}
  if(t.hasAttribute('data-closenav')){navOpen=false;render();return;}
  if(t.hasAttribute('data-opennav')){navOpen=true;render();return;}
  if(t.hasAttribute('data-collapse')){collapsed=!collapsed;try{localStorage.setItem('dbd-collapsed',collapsed?'1':'0');}catch(e){}render();return;}
  if(t.hasAttribute('data-help')){modal={type:'help'};navOpen=false;render();return;}
  if(t.hasAttribute('data-menu')){menuOpen=!menuOpen;render();return;}
  if(t.dataset.export){menuOpen=false;
    if(t.dataset.export==='csv'){render();exportCSV();flash('CSV downloaded');}
    else if(t.dataset.export==='print'){render();setTimeout(function(){window.print();},50);}
    else {modal={type:'share'};render();}
    return;}
  if(t.hasAttribute('data-copylink')){var inp=document.getElementById('sharelink');
    var done=function(){modal.copied=true;render();};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(inp.value).then(done,function(){inp.select();});else{inp.select();}
    return;}
  if(t.dataset.tab){tab=t.dataset.tab;notice='';modal=null;navOpen=false;query='';render();window.scrollTo(0,0);return;}
  if(t.dataset.goto){tab=t.dataset.goto;render();window.scrollTo(0,0);return;}
  if(t.dataset.openday){query='';openDay(t.dataset.openday);return;}
  if(t.dataset.editGo){if(!readOnly)goEdit(t.dataset.editGo);return;}
  if(t.hasAttribute('data-feedall')){feedAll=!feedAll;render();return;}
  if(t.dataset.bulk){
    var keys=Object.keys(selected).filter(function(x){return selected[x];});
    if(t.dataset.bulk==='clear'){selected={};render();return;}
    if(t.dataset.bulk==='done'){var at=now().hhmm;keys.forEach(function(x){setEntry(k,x,{s:'done',at:at,via:'web'});});selected={};render();return;}
    modal={type:'bulk',s:t.dataset.bulk};render();return;
  }
  if(t.hasAttribute('data-bulkconfirm')){
    var why=(document.getElementById('bulkwhy').value||'').trim();
    if(!why){modal.err='Give a reason. One reason covers all of them.';render();return;}
    var at2=now().hhmm;Object.keys(selected).filter(function(x){return selected[x];}).forEach(function(x){setEntry(k,x,{s:modal.s,why:why,at:at2,via:'web'});});
    selected={};modal=null;render();return;
  }
  if(t.dataset.cal){var a=calMonth.split('-').map(Number),dt=new Date(Date.UTC(a[0],a[1]-1+Number(t.dataset.cal),1));calMonth=dt.toISOString().slice(0,7);calSel=calMonth+'-01';render();return;}
  if(t.hasAttribute('data-caltoday')){calMonth=k.slice(0,7);calSel=k;render();return;}
  if(t.dataset.day){calSel=t.dataset.day;render();var sec=document.getElementById('cal-detail');if(sec&&sec.scrollIntoView)sec.scrollIntoView({block:'start',behavior:'smooth'});return;}
  if(readOnly)return;
  if(t.dataset.act){
    var id=t.dataset.id,cur=entry(k,id),act=t.dataset.act,at3=now().hhmm;
    if(cur&&cur.s===act)setEntry(k,id,null);
    else setEntry(k,id,act==='done'?{s:'done',at:at3,via:'web'}:{s:act,why:(cur&&cur.why)||'',at:at3,via:'web'});
    barErr='';render();
    if(NEEDS_WHY[act]){var w=app.querySelector('[data-why="'+id+'"]');if(w)w.focus();}
    return;
  }
  if(t.hasAttribute('data-save')){save();return;}
  if(t.hasAttribute('data-test')){
    if(dirty){toolMsg='Save your changes first, so the email matches.';render();return;}
    var slot=document.getElementById('testslot').value;toolMsg='Sending\u2026';render();
    api('POST','/api/cron?force='+slot).then(function(r){
      toolMsg=r.ok?'Sent. Check your inbox for the '+SLOT_NAME[slot].toLowerCase()+' email.':'Send failed: '+(r.data&&r.data.error||r.status);render();});
    return;
  }
  if(t.hasAttribute('data-logout')){api('DELETE','/api/login').then(function(){state=null;renderLogin('');});return;}
  if(t.hasAttribute('data-add')){editErr='';editing={id:'c'+Date.now().toString(36),title:'',tier:'word',slot:'morning',freq:'daily',day:null,amount:'',since:k,isNew:true};render();return;}
  if(t.dataset.edit){goEdit(t.dataset.edit);return;}
  if(t.hasAttribute('data-cancel')){editing=null;render();return;}
  if(t.hasAttribute('data-delete')){
    if(!editing.confirmDelete){readForm();editing.confirmDelete=true;render();return;}
    var delId=editing.id;state.commitments=state.commitments.filter(function(x){return x.id!==delId;});editing=null;dirty=true;render();return;
  }
  if(t.hasAttribute('data-apply')){
    readForm();
    if(!String(editing.title).trim()){editErr='Give it a name.';render();return;}
    if(editing.freq==='once'&&!editing.date){editErr='Pick a date for a one-time item.';render();return;}
    if(editing.freq==='monthly'&&editing.day!=null&&(editing.day<1||editing.day>31)){editErr='Due day has to be between 1 and 31.';render();return;}
    var obj={id:editing.id,title:editing.title.trim(),tier:editing.tier,slot:editing.slot,freq:editing.freq,since:editing.since||k};
    if(obj.freq==='monthly'){obj.day=editing.day||null;obj.amount=(editing.amount||'').trim();}
    if(obj.freq==='once'){obj.date=editing.date;obj.amount=(editing.amount||'').trim();}
    if(editing.parts&&editing.parts.length)obj.parts=editing.parts;
    var idx=state.commitments.map(function(x){return x.id;}).indexOf(obj.id);
    if(idx>-1)state.commitments[idx]=obj;else state.commitments.push(obj);
    editing=null;editErr='';dirty=true;render();return;
  }
});
app.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.id==='q'){query=el.value;renderSearch();return;}
  if(el.dataset&&el.dataset.why){var e=entry(now().key,el.dataset.why);
    if(e){e.why=el.value;dirty=true;el.classList.toggle('need',!el.value.trim());barErr='';renderBar();renderSync();}}
});
app.addEventListener('change',function(ev){
  var el=ev.target;if(!el.dataset)return;
  if(el.hasAttribute('data-range')){range=Number(el.value);render();return;}
  if(el.hasAttribute('data-cat')){catFilter=el.value;selected={};render();return;}
  if(el.dataset.sel){selected[el.dataset.sel]=el.checked;render();return;}
  if(el.hasAttribute('data-selall')){var n=now(),cps=state.settings.checkpoints;
    unitsOn(n.key).filter(catOk).filter(function(u){return !entry(n.key,u.key)&&toMins(cps[u.c.slot])<=n.mins;}).forEach(function(u){selected[u.key]=el.checked;});render();return;}
  if(el.dataset.cp&&el.value){state.settings.checkpoints[el.dataset.cp]=el.value;dirty=true;render();}
  if(el.dataset.f==='freq'||el.dataset.f==='tier'){readForm();render();}
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Escape')return;
  if(modal){modal=null;render();}else if(menuOpen){menuOpen=false;render();}else if(navOpen){navOpen=false;render();}
  else if(query){query='';var q=document.getElementById('q');if(q)q.value='';renderSearch();}
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&state&&!dirty&&!modal)load(true);});
setInterval(function(){
  if(document.visibilityState!=='visible'||!state)return;
  var a=document.activeElement;
  if(dirty||modal||menuOpen||(a&&a.matches&&a.matches('input,select,textarea')))return;
  load(true);
},60000);
setInterval(renderSync,30000);
load();
})();
</script>
</body>
