<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D131A">
<title>Day by Datum</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous" onload="window.__chartReady&&window.__chartReady()"></script>
<style>
/* ===== Tokens (dark, single accent) ===== */
:root{
  --bg:#0D131A; --card:#141C25; --card-2:#19232E; --line:#232F3D; --line-2:#2F3E50;
  --ink:#E6EDF3; --muted:#8C9AA9; --faint:#5F6D7C;
  --accent:#3ECFB2; --accent-ink:#052620; --accent-soft:rgba(62,207,178,.12);
  --done:#3ECFB2; --done-soft:rgba(62,207,178,.10);
  --amber:#F2B84B; --amber-soft:rgba(242,184,75,.12); --amber-ink:#F2B84B;
  --miss:#F07070; --miss-soft:rgba(240,112,112,.12);
  --side-bg:#0A0F15; --side-ink:#C9D3DD;
  --g-health:#38BDF8; --g-money:#818CF8; --g-habits:#C084FC; --g-events:#FB923C;
  --display:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px; --r-sm:7px; --gap:12px;
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{max-width:100%;overflow-x:clip}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--body);-webkit-text-size-adjust:100%;font-feature-settings:"tnum" 1,"cv11" 1}
b,strong{font-weight:600}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:12px} .fine{font-size:11.5px;color:var(--faint);margin:10px 0 0}
.bad-text,.down{color:var(--miss);font-weight:600} .up{color:var(--done);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::selection{background:var(--accent-soft)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}

/* ===== Calendar links ===== */
.cal-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.cal-links.compact{margin:10px 0 12px}
.cal-link{display:flex;align-items:center;justify-content:center;gap:12px;height:64px;padding:0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);font:inherit;font-weight:600;font-size:14px;cursor:pointer;min-width:0}
.cal-link:hover,.cal-link:focus-visible{border-color:var(--accent);background:var(--card-2)}
.cal-logo{flex:none;display:block;width:36px;height:36px}
.cal-logo img{display:block;width:100%;height:100%;object-fit:contain}
.cal-logo.nologo{border-radius:8px;background:var(--line-2)}.cal-logo.nologo img{display:none}
.cal-link-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-links.compact .cal-link{height:48px;gap:10px;font-size:13px}
.cal-links.compact .cal-logo{width:26px;height:26px}
.dialog .form-actions{margin-top:14px}
.row-actions{display:flex;gap:6px;flex:none}
.how{margin:14px 0 8px;padding-left:20px;display:grid;gap:8px}
.how li{padding-left:4px}
.how-note{font-size:12px;color:var(--muted);background:var(--card-2);border-radius:var(--r-sm);padding:8px 10px;margin:0 0 14px}
.seg-sm button{padding:8px 10px}
.file-drop{display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r);padding:22px;cursor:pointer}
.file-drop:hover{border-color:var(--accent)}
.file-drop input{position:absolute;width:1px;height:1px;opacity:0}
.file-drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.file-drop>span{display:flex;flex-direction:column;gap:2px}
.prev-sum{margin:14px 0 8px}
.prev-list{list-style:none;margin:0;padding:0;max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.prev-list li{border-top:1px solid var(--line)}.prev-list li:first-child{border-top:0}
.prev-list label{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;cursor:pointer}
.prev-list input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.prev-list label>span{display:flex;flex-direction:column;min-width:0}
.dialog .form-actions{margin-top:14px}
@media (max-width:600px){.cal-link{padding:0 10px;gap:8px;font-size:13px}.cal-links.compact .cal-link{height:44px;gap:8px}.cal-links.compact .cal-logo{width:22px;height:22px}.cal-link-t{font-size:13px}.crow{flex-wrap:wrap}}

/* ===== Onboarding & templates ===== */
.onb-page{max-width:1120px;margin:0 auto;padding:20px 24px 120px}
.onb-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:36px}
.onb-head .brand{padding:0}
.onb-hero{max-width:640px;margin-bottom:28px}
.onb-hero h1{font-size:28px;line-height:1.2;margin:0 0 10px}
.onb-hero p{font-size:15px;margin:0}
.onb{max-width:1120px}
.onb-title{margin-bottom:18px;max-width:680px}
.onb-title h2{font-size:22px;margin:6px 0 6px}
.onb-title p{margin:0}
.onb-back{margin-top:4px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--gap)}
.tpl-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;min-width:0;transition:border-color .12s}
.tpl-card:hover,.tpl-card:focus-visible{border-color:var(--accent)}
.tpl-name{font-size:15px;font-weight:600}
.tpl-blurb{font-size:13px;color:var(--muted)}
.tpl-peek{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:3px;font-size:12px;color:var(--faint);width:100%}
.tpl-peek li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-peek li::before{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--line-2);margin:0 8px 2px 0;vertical-align:middle}
.tpl-meta{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;width:100%;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.tpl-dots{display:flex;gap:4px}.tpl-dots i{width:8px;height:8px;border-radius:2px}
.tpl-scratch{border-style:dashed;justify-content:flex-start}
.tpl-plus{margin-top:auto;font-size:28px;line-height:1;color:var(--accent)}
.onb-cps{margin-bottom:var(--gap)}
.onb-group{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.onb-group:first-of-type{margin-top:4px}
.onb-group i{width:8px;height:8px;border-radius:2px}
.onb-rows{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r-sm)}
.onb-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.onb-row:first-child{border-top:0}
.onb-row.off .onb-check b{color:var(--faint)}
.onb-check{display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0;cursor:pointer}
.onb-check input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.onb-check span{display:flex;flex-direction:column;gap:1px;min-width:0}
.onb-check b{font-weight:600}
.onb-pr{width:auto;flex:none}
.onb-day{width:92px;flex:none}
.onb-foot{position:fixed;left:0;right:0;bottom:0;background:var(--side-bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:20}
.onb-foot-in{max-width:1120px;margin:0 auto;display:flex;justify-content:flex-end;align-items:center;gap:14px}
.onb .onb-foot{left:var(--sbw,0)}
@media (max-width:900px){.onb .onb-foot{left:0}}
@media (max-width:600px){
  .onb-page{padding:14px 14px 120px}.onb-head{margin-bottom:22px}.onb-hero h1{font-size:22px}
  .onb-row{flex-wrap:wrap;row-gap:8px}.onb-check{flex:1 1 55%}.onb-pr{order:2}.onb-day{order:3;margin-left:26px}
  .onb-foot-in{justify-content:space-between}
}

/* ===== Controls ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:13px;font-weight:600;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--faint)}
.btn:disabled{opacity:.45;cursor:default}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-wide{width:100%;margin-top:12px}
.b-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.b-danger{color:var(--miss);border-color:rgba(240,112,112,.45);background:transparent}
.b-done[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--accent-ink)}
.b-miss[aria-pressed="true"],.b-miss-solid{background:var(--miss);border-color:var(--miss);color:#2A0B0B}
.b-byp[aria-pressed="true"]{background:var(--line-2);border-color:var(--faint);color:var(--ink)}
.link{font:inherit;font-size:13px;font-weight:600;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.link:hover{text-decoration:underline}
.link-btn{background:transparent!important;border-color:transparent!important;color:inherit!important;text-decoration:underline}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border:0;border-radius:var(--r-sm);background:transparent;color:inherit;cursor:pointer;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.06)}
.icon-btn svg,.nav-btn svg{width:18px;height:18px}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-sm);width:100%}
input,select{height:34px;padding:0 10px}
textarea{padding:8px 10px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.need{border-color:var(--miss)}
input[type=checkbox]{width:16px;height:16px;padding:0;margin:0;accent-color:var(--accent);flex:none}
input[type=date],input[type=time]{color-scheme:dark}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.error-line{color:var(--miss);font-weight:600;font-size:13px;margin:0}
.status{font-size:12px;color:var(--muted);margin:6px 0 0}

/* ===== Tags & pills ===== */
.tag,.pill,.prio{display:inline-flex;align-items:center;font-size:11px;font-weight:600;line-height:1;padding:4px 7px;border-radius:5px;white-space:nowrap}
.tag-done,.pill-good{background:var(--done-soft);color:var(--done)}
.tag-missed,.pill-bad{background:var(--miss-soft);color:var(--miss)}
.tag-bypassed,.pill-none{background:rgba(140,154,169,.12);color:var(--muted)}
.tag-silent,.pill-warn{background:var(--amber-soft);color:var(--amber)}
.prio{padding:2px 6px;border:1px solid var(--line-2);color:var(--muted);vertical-align:1px;margin-right:4px}
.prio-high{border-color:var(--accent);color:var(--accent)}
.prio-low{border-style:dashed}

/* ===== Shell ===== */
.shell{--sbw:216px;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100vh}
.shell.collapsed{--sbw:60px}
.side{position:sticky;top:0;height:100vh;background:var(--side-bg);color:var(--side-ink);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:14px 10px;overflow-y:auto;overflow-x:hidden;z-index:30}
.brand{display:flex;align-items:center;gap:9px;padding:0 4px 12px}
.brand-mark{flex:none;width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.brand-name{font-weight:700;font-size:14px;white-space:nowrap;flex:1;color:var(--ink)}
.collapse-btn{opacity:.6}
.collapsed .collapse-btn svg{transform:rotate(180deg)}
.search{position:relative;margin-bottom:8px}
.search-ico{position:absolute;left:9px;top:8px;opacity:.55;pointer-events:none}
.search-ico svg{width:16px;height:16px}
.search input{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--ink);padding-left:32px;height:32px}
.search input::placeholder{color:var(--faint)}
.search-results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card-2);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 18px 40px rgba(0,0,0,.45);max-height:60vh;overflow:auto;padding:4px;z-index:40;min-width:260px}
.sr{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;font:inherit;font-size:13px;color:inherit;background:transparent;border:0;border-radius:var(--r-sm);padding:7px 9px;cursor:pointer}
.sr:hover,.sr:focus-visible{background:rgba(255,255,255,.05)}
.sr span{font-size:11.5px;color:var(--muted)}
.sr-empty{margin:0;padding:9px;color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--side-ink);opacity:.75;font:inherit;font-size:13px;font-weight:500;text-align:left;cursor:pointer;white-space:nowrap}
.nav-btn:hover{background:rgba(255,255,255,.05);opacity:1}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);opacity:1;font-weight:600}
.nav-btn svg{flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--line);padding-top:8px}
@media (min-width:901px){
  .collapsed .label,.collapsed .search,.collapsed .brand-name{display:none}
  .collapsed .nav-btn{justify-content:center;padding:0}
  .collapsed .brand{flex-direction:column;gap:6px}
}
.scrim{display:none}
.main{min-width:0;padding:16px 20px 96px}
.main .wrap{max-width:760px;margin:0;padding:0 0 32px}
.main .wrap-today{max-width:1240px}.main .wrap-cal{max-width:1100px}
.today-main>.slot:first-child{margin-top:0}
@media (min-width:1100px){
  .today-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
  .today-side{position:sticky;top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
  .today-side .hero{margin:0}
  .today-side .track{margin:14px 10px 4px}
}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tb-left{display:flex;align-items:center;gap:8px;min-width:0}
.page-title{font-size:18px;font-weight:700;line-height:1.2;margin:0}
.page-sub{color:var(--muted);font-size:12px;margin:2px 0 0}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.controls select{width:auto;height:32px;padding:0 28px 0 10px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-right:4px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--done);box-shadow:0 0 0 3px var(--done-soft)}
.sync.err i{background:var(--miss);box-shadow:0 0 0 3px var(--miss-soft)}
.sync.dirty i{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.menu{position:relative}
.menu .btn svg{width:15px;height:15px}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--card-2);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 18px 40px rgba(0,0,0,.45);padding:4px;z-index:20}
.menu-pop button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:transparent;border:0;border-radius:var(--r-sm);padding:8px 10px;cursor:pointer}
.menu-pop button:hover,.menu-pop button:focus-visible{background:rgba(255,255,255,.05)}
.menu-pop span{font-weight:400;font-size:11.5px;color:var(--muted)}
.menu-btn{display:none}

/* ===== Cards ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;min-width:0}
.card-head h2{font-size:14px;font-weight:600;margin:0}
.card-head .small{white-space:nowrap}
.sub-h{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.empty{margin:2px 0;color:var(--muted);font-size:13px}
.notice{background:var(--amber-soft);border:1px solid rgba(242,184,75,.25);padding:9px 12px;border-radius:var(--r-sm);margin:12px 0 0;font-size:13px}
.notice p{margin:0}.notice p+p{margin-top:4px}
.notice.ro{margin:0 0 12px;background:var(--accent-soft);border-color:rgba(62,207,178,.25)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}

/* ===== Home grid ===== */
.home{max-width:1600px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.kpi{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;min-width:0;transition:border-color .12s}
.kpi:hover{border-color:var(--line-2)}
.kpi.alert{border-color:rgba(240,112,112,.5)}
.kpi-label{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-width:0}
.kpi-value{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-value small{font-size:13px;font-weight:500;margin-left:3px;color:var(--muted);letter-spacing:0}
.kpi-value-sm{font-size:20px}
.kpi-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{flex:none;width:84px;height:28px;overflow:visible}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.dash>*{min-width:0;display:flex}
.dash>*>.card{flex:1}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.chart-box{position:relative;height:190px}
.chart-fallback{color:var(--muted);font-size:12px}

/* Weekly bar */
.wk{margin:0}
.wk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.wk-head h2{font-size:14px;font-weight:600;margin:0 0 2px}
.wk-num{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.wk-track{position:relative;padding-top:18px}
.wk-bar,.mini-bar{display:flex;width:100%;overflow:hidden;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line)}
.wk-bar{height:18px;border-radius:5px}
.seg{display:block;height:100%;min-width:2px}
.seg+.seg{box-shadow:inset 1px 0 0 var(--card)}
.wk-pace{position:absolute;top:0;bottom:-3px;pointer-events:none}
.wk-pace i{position:absolute;top:14px;bottom:0;left:-1px;width:2px;background:var(--ink);border-radius:1px}
.wk-pace b{position:absolute;top:0;left:0;transform:translateX(-50%);font-size:10.5px;font-weight:600;white-space:nowrap;color:var(--muted)}
.wk-pace.al-l b{transform:none}.wk-pace.al-r b{transform:translateX(-100%)}
.wk-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.wk-legend{display:flex;gap:14px;flex-wrap:wrap;list-style:none;margin:0;padding:0;font-size:12px}
.wk-legend li{display:flex;align-items:center;gap:6px}
.wk-legend i{width:9px;height:9px;border-radius:2px;flex:none}
.wk{display:flex;flex-direction:column}
.wk-days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);min-height:120px}
.wk-day{display:flex;flex-direction:column;align-items:stretch;gap:4px;font:inherit;color:var(--muted);background:transparent;border:0;padding:0;cursor:pointer;min-width:0}
.wk-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;background:var(--card-2);border-radius:4px;overflow:hidden;min-height:48px;box-shadow:inset 0 0 0 1px var(--line)}
.wk-fill{display:flex;flex-direction:column-reverse;width:100%}
.wk-fill i{display:block;min-height:2px}
.wk-day b{font-size:11px;font-weight:600;text-align:center;color:var(--ink)}
.wk-day span:last-child{font-size:11px;text-align:center;font-variant-numeric:tabular-nums}
.wk-day.future{opacity:.45}
.wk-day.is-today .wk-col{box-shadow:inset 0 0 0 1px var(--accent)}
.wk-day.is-today b{color:var(--accent)}
.wk-day:hover .wk-col{box-shadow:inset 0 0 0 1px var(--faint)}
.attn-more{margin-top:8px}
.wk-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}

/* Attention */
.attn{list-style:none;margin:0;padding:0}
.attn li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;min-width:0}
.attn li:first-child{border-top:0;padding-top:0}
.attn-head{font-size:11.5px;font-weight:600;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;cursor:pointer}
.attn .grow{flex:1;min-width:0}
.attn .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.dotcol{flex:none;width:16px;height:4px;border-radius:2px}
.bulk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid rgba(62,207,178,.3);border-radius:var(--r-sm);padding:6px 8px;margin-bottom:8px;font-size:12.5px}
.bulk b{margin-right:auto;padding-left:2px;color:var(--accent)}
.bulk .btn{height:28px;padding:0 10px;font-size:12px}
.bulk .b-done{background:var(--done);border-color:var(--done);color:var(--accent-ink)}

/* Health */
.hstat{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ring{flex:none;width:64px;height:64px}
.ring-txt{font-size:15px;font-weight:700;fill:var(--ink)}
.hstat .muted{font-size:12px;line-height:1.35}
.hrow{padding:5px 0}
.hrow-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.hrow-top span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar{height:4px;border-radius:2px;background:var(--card-2);overflow:hidden;margin-top:5px}
.hbar i{display:block;height:100%;border-radius:2px}
.tips{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.tips li{padding-left:10px;border-left:2px solid var(--accent);font-size:12.5px;color:#C4CED8}

/* Feed */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.feed li:first-child{border-top:0;padding-top:0}
.feed .tag{justify-self:start}
.feed li>div{min-width:0}
.feed li>div b{font-weight:500}
.feed li>div .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time-btn{font:inherit;background:transparent;border:0;color:var(--muted);cursor:pointer;text-align:right;padding:0;font-size:12px;white-space:nowrap}
.time-btn:hover time{color:var(--ink)}

/* ===== Today ===== */
.hero{margin:4px 0 4px}
.hero-time{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero-label{font-size:13px;color:var(--muted);margin-top:2px}
.track{position:relative;height:40px;margin:14px 8px 2px}
.track-line,.track-fill{position:absolute;left:0;top:8px;height:4px;border-radius:2px}
.track-line{right:0;background:var(--card-2)}
.track-fill{background:var(--accent);opacity:.5}
.tick{position:absolute;top:3px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap}
.tick i{display:block;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--faint)}
.tick.passed i{background:var(--accent);border-color:var(--accent)}
.tick.late i{background:var(--miss);border-color:var(--miss)}
.tick.late span{color:var(--miss);font-weight:600}
.now{position:absolute;top:0;width:2px;height:20px;border-radius:1px;background:var(--amber);transform:translateX(-50%)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-weight:600;font-size:13px}
.slot{margin-top:18px}
.slot-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 6px}
.slot-head h2{font-size:14px;font-weight:600;margin:0}
.slot-head span{font-size:12px;color:var(--muted)}
.slot-head span.bad-text{color:var(--miss)}
.items,.clist,.misses,.hist-list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:9px 12px;border-top:1px solid var(--line);border-left:3px solid transparent;align-items:center}
.item:first-child{border-top:0}
.item.done{border-left-color:var(--done);background:var(--done-soft)}
.item.missed{border-left-color:var(--miss);background:var(--miss-soft)}
.item.overdue{border-left-color:var(--amber)}
.item.bypassed{border-left-color:var(--faint)}
.item.bypassed .item-title{color:var(--muted)}
.item.group{padding-bottom:2px;grid-template-columns:1fr}
.item.sub{border-top:0;padding-left:26px}
.item.sub .item-title{font-weight:500}
.item-title{font-weight:600;font-size:13.5px;display:block}
.item-meta{font-size:12px;color:var(--muted)}
.late-tag{color:var(--miss);font-weight:600}
.item-actions{display:flex;gap:5px}
.item-actions .btn{height:28px;padding:0 10px;font-size:12px}
.why{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.why-ro{grid-column:1/-1;margin:0;font-size:12.5px;color:var(--muted)}
.foot{margin-top:20px;font-size:12px;color:var(--faint)}

/* ===== Calendar ===== */
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.cal-head .sec{margin:0}
.cal-nav{display:flex;gap:4px}
.cal-nav .btn{min-width:32px;padding:0 8px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-wd span{font-size:11px;color:var(--faint);text-align:center;padding:3px 0}
.cal-cell{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-height:70px;padding:5px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;overflow:hidden;min-width:0}
.cal-cell:not(.blank):hover{background:rgba(255,255,255,.03);border-color:var(--line)}
.cal-cell.blank{cursor:default}
.cal-cell.past{opacity:.75}
.cal-cell.today{border-color:var(--accent)}
.cal-cell.sel{background:var(--card-2);border-color:var(--line-2)}
.cal-top{display:flex;justify-content:space-between;align-items:center}
.cal-top b{font-size:12px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.full{background:var(--done)}.dot.part{background:var(--amber)}.dot.low{background:var(--miss)}
.chip{display:block;font-size:10.5px;font-weight:500;line-height:1.3;padding:1px 4px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-monthly{background:var(--amber-soft);color:var(--amber)}
.chip-once{background:rgba(230,237,243,.1);color:var(--ink)}
.chip-event{background:rgba(251,146,60,.16);color:var(--g-events)}
.chip-more,.routine{font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.routine{margin-top:auto}
.dd-h{font-size:13px;font-weight:600;margin:0}

/* ===== Scorecard ===== */
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.sec{font-size:14px;font-weight:600;margin:20px 0 8px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{aspect-ratio:1.15;border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;font-size:10.5px;line-height:1.2;background:var(--card);border:1px solid var(--line);color:var(--muted);cursor:pointer;min-width:0}
.cell b{font-size:13px;color:var(--ink)}
.cell.full{background:var(--done-soft);border-color:rgba(62,207,178,.45)}
.cell.part{background:var(--amber-soft);border-color:rgba(242,184,75,.45)}
.cell.low{background:var(--miss-soft);border-color:rgba(240,112,112,.45)}
.cell.none{opacity:.4}
.misses li{padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.misses li:first-child{border-top:0}

/* ===== Progress history ===== */
.hist{max-width:1100px}
.hist-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);margin-bottom:12px}
.hist-sum>div{display:flex;flex-direction:column;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.hist-legend{margin-bottom:8px}
.hist-row{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:14px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:13px}
.hist-row:first-child{border-top:0}
.hist-row.cur{background:var(--card-2)}
.hist-when{display:flex;flex-direction:column}
.mini-bar{height:10px;border-radius:3px}
.hist-num{display:flex;flex-direction:column;align-items:flex-end}

/* ===== Commitments & forms ===== */
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.crow:first-child{border-top:0}
.crow>div{min-width:0}
.cps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.form{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:14px;display:grid;gap:10px;margin-top:12px}
.form .sec{margin:0}
.form-actions{display:flex;gap:6px;flex-wrap:wrap}
.add-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.add-row .btn{flex:1}
.seg-ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.seg-ctl button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 10px;cursor:pointer}
.seg-ctl button span{font-weight:400;font-size:11.5px;color:var(--muted)}
.seg-ctl button[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qual{border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 12px 12px;margin:0;display:grid;gap:2px}
.qual legend{font-weight:600;font-size:12px;color:var(--muted);padding:0 4px}
.qual-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;cursor:pointer;font-size:13px}
.qual-row b{font-weight:500}
.qual-pts{font-size:11px;font-weight:600;color:var(--faint)}
.qual-sug{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card-2);border-radius:var(--r-sm);padding:7px 9px;margin:6px 0 4px;font-size:12.5px}
.tools{display:grid;gap:8px}
.tools-row{display:flex;gap:8px}.tools-row select{flex:1}

/* ===== Save bar, toast, modal ===== */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card-2);border-top:1px solid var(--line-2);color:var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5;font-size:13px}
.bar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn-save{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:0 18px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--card-2);border:1px solid rgba(62,207,178,.4);color:var(--accent);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.overlay{position:fixed;inset:0;background:rgba(3,6,10,.65);display:grid;place-items:center;padding:16px;z-index:50}
.dialog{background:var(--card);color:var(--ink);border:1px solid var(--line-2);border-radius:12px;width:100%;max-width:520px;max-height:85vh;overflow:auto;padding:16px 18px;box-shadow:0 24px 64px rgba(0,0,0,.55)}
.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.dialog-head h2{font-size:16px;margin:0}
.dialog p{font-size:13px}
.help dt{font-weight:600;font-size:13px;margin-top:10px}.help dd{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.bulk-list{margin:0 0 12px;padding-left:18px;font-size:13px}

/* ===== Login & loading ===== */
.login{max-width:340px;margin:14vh auto 0;padding:0 16px}
.login h1{font-size:22px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.login h1::before{content:"D";width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
.login form{display:grid;gap:10px;margin-top:18px}
.login .btn{height:36px}
.login .card{margin-top:14px}
.skel-page{max-width:1600px;padding:20px}
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--card) 25%,var(--card-2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.skel-title{height:24px;width:180px;margin-bottom:16px}
.skel-kpi{height:86px}
.skel-card{height:220px}
.skel-page .kpis{margin-bottom:12px}
.skel-page .row{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* ===== Responsive ===== */
@media (max-width:1280px){.c8{grid-column:span 7}.c4{grid-column:span 5}.c5{grid-column:span 12}.c4.chart,.c3{grid-column:span 6}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.c8,.c4,.c5,.c3,.c4.chart{grid-column:span 12}}
@media (max-width:900px){
  .shell,.shell.collapsed{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:248px;height:auto;transform:translateX(-100%);transition:transform .2s ease;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .nav-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  .nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(3,6,10,.6);z-index:25}
  .collapse-btn{display:none}
  .menu-btn{display:inline-grid;margin-left:-6px}
  .main{padding:10px 12px 92px}
  .controls{width:100%}
  .controls select{flex:1;min-width:0}
  .sync{order:9;width:100%}
}
@media (max-width:560px){
  :root{--gap:10px}
  .kpi{padding:10px 12px}.kpi-value{font-size:22px}.kpi-value-sm{font-size:17px}.spark{width:64px}
  .card{padding:12px}
  .wk-head{flex-direction:column}.wk-num{align-items:flex-start;text-align:left}
  .feed li{grid-template-columns:auto minmax(0,1fr)}.feed .time-btn{grid-column:2;text-align:left}
  .item{grid-template-columns:minmax(0,1fr)}.item-actions .btn{flex:1}
  .cps,.row2,.seg-ctl{grid-template-columns:minmax(0,1fr)}
  .hist-sum{grid-template-columns:1fr 1fr}.hist-sum>div:last-child{grid-column:1/-1}
  .hist-row{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:9px 12px}.hist-row .mini-bar{grid-column:1/-1;grid-row:2}
  .cal-cell{min-height:52px;padding:3px}.chip{font-size:9.5px;padding:1px 2px}.routine{display:none}
}
@media (pointer:coarse){.btn{height:38px}.item-actions .btn{height:36px}.nav-btn{height:40px}input,select{height:38px}}
@media (min-width:901px){.bar{left:var(--sbw)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  :root{--bg:#fff;--card:#fff;--card-2:#f3f5f7;--line:#dde2e8;--ink:#111;--muted:#555}
  .side,.controls,.bar,.scrim,.menu-btn,.toast,.overlay{display:none!important}
  .shell{display:block}.main{padding:0}
  .card,.kpi{break-inside:avoid}
}

/* ===== Atmosphere: faint glow, film grain, glass surfaces ===== */
:root{--glass:rgba(22,31,41,.56);--glass-strong:rgba(19,27,36,.86);--glass-line:rgba(255,255,255,.07);--glass-rim:rgba(255,255,255,.13);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0) 40%);--blur:blur(14px) saturate(140%)}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(42vmax 30vmax at 12% 4%,rgba(62,207,178,.20),transparent 64%),
    radial-gradient(36vmax 32vmax at 92% 10%,rgba(129,140,248,.17),transparent 66%),

<script>(function(){

  {id:'people',label:'Other people are counting on it',hint:'plans, bandmates, family, a client',pts:2},
  {id:'money',label:'Missing it costs money',hint:'late fee, lost ticket, penalty',pts:2},
  {id:'health',label:'It\u2019s for my health',pts:1},
  {id:'fixed',label:'It has a fixed time or hard deadline',pts:1},
  {id:'goal',label:'It moves a bigger goal forward',pts:1}];
function suggestPrio(q){
  q=q||[];var score=0,why=[];
  QUALS.forEach(function(x){if(q.indexOf(x.id)>-1){score+=x.pts;why.push(x.label.toLowerCase());}});

}
function slotFor(t){var m=toMins(t),cps=state.settings.checkpoints;return SLOTS.filter(function(s){return toMins(cps[s])>=m;})[0]||'evening';}

function unitWeight(u){return PRIO[prioOf(u.c)].w/((u.c.parts&&u.c.parts.length)||1);}

/* ---------- Helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function now(){
  var f=new Intl.DateTimeFormat('en-US',{timeZone:state.settings.tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  var p={};f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
  var h=(+p.hour)%24;
  return {key:p.year+'-'+p.month+'-'+p.day,mins:h*60+(+p.minute),hhmm:String(h).padStart(2,'0')+':'+p.minute};
}
function toMins(t){var a=t.split(':').map(Number);return a[0]*60+a[1];}
function fmt12(t){var a=t.split(':').map(Number),h=a[0],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(a[1]).padStart(2,'0')+' '+ap;}

function fmtDate(k,long){return parseKey(k).toLocaleDateString('en-US',long?{timeZone:'UTC',weekday:'long',month:'long',day:'numeric'}:{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function occurs(c,k){
  if(c.since&&k<c.since)return false;
  var d=parseKey(k),wd=d.getUTCDay();
  if(c.freq==='once')return !!c.date&&c.date===k;
  if(c.freq==='daily')return true;
  if(c.freq==='weekdays')return wd>=1&&wd<=5;
  if(c.freq==='weekly')return c.dow!=null&&c.dow!==''&&wd===Number(c.dow);
  if(c.freq==='monthly'){if(!c.day)return false;var last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();return d.getUTCDate()===Math.min(c.day,last);}

function setEntry(k,id,val){state.log[k]=state.log[k]||{};if(val)state.log[k][id]=val;else delete state.log[k][id];if(!Object.keys(state.log[k]).length)delete state.log[k];dirty=true;}
function units(c){return (c.parts&&c.parts.length)?c.parts.map(function(p){return {key:c.id+'.'+p.id,title:p.title,c:c,sub:true};}):[{key:c.id,title:c.title,c:c,sub:false}];}
function unitsOn(k){var u=[];state.commitments.forEach(function(c){if(occurs(c,k))u=u.concat(units(c));});return u;}
function findUnit(key){var a=key.split('.'),c=state.commitments.filter(function(x){return x.id===a[0];})[0];if(!c)return null;var us=units(c);return us.filter(function(u){return u.key===key;})[0]||null;}
function unitTitle(key){var a=key.split('.'),c=state.commitments.filter(function(x){return x.id===a[0];})[0];if(!c)return '(deleted commitment)';
  if(a.length<2)return c.title;var pt=(c.parts||[]).filter(function(x){return x.id===a[1];})[0];return c.title+': '+(pt?pt.title:'(deleted part)');}
function fullTitle(u){return (u.sub?u.c.title+': ':'')+u.title;}
function catOk(u){return catFilter==='all'||u.c.tier===catFilter;}
function isSpecial(c){return c.freq==='monthly'||c.freq==='once';}
function freqText(c){if(c.freq==='weekly')return 'Weekly on '+(DOW[c.dow]||'Monday');if(c.freq==='once')return c.date?'One time on '+fmtDate(c.date):'One time, date not set';if(c.freq==='monthly')return c.day?'Monthly on the '+ord(c.day):'Monthly, due day not set';return FREQ_OPT[c.freq];}
function isPast(k,u,n){return k<n.key||(k===n.key&&toMins(state.settings.checkpoints[u.c.slot])<=n.mins);}
function tagHTML(s){return '<span class="tag tag-'+s+'">'+(STATUS_LBL[s]||'Never marked')+'</span>';}
function ago(t){var m=Math.round((Date.now()-t)/60000);return m<1?'just now':m===1?'1 min ago':m<60?m+' min ago':Math.round(m/60)+' hr ago';}

/* ---------- Scoring ---------- */
function dayScore(k,n){
  var us=unitsOn(k).filter(catOk);
  if(!us.length)return null;
  var r={done:0,missed:0,silent:0,open:0,bypassed:0};
  us.forEach(function(u){var e=entry(k,u.key);
    if(e&&e.s==='done')r.done++;else if(e&&e.s==='missed')r.missed++;else if(e&&e.s==='bypassed')r.bypassed++;
    else if(isPast(k,u,n))r.silent++;else r.open++;});
  r.counted=r.done+r.missed+r.silent;return r;
}
function periodStats(endKey,days,n){
  var t={done:0,missed:0,silent:0,bypassed:0,counted:0};
  for(var i=days-1;i>=0;i--){var s=dayScore(addDays(endKey,-i),n);if(s){t.done+=s.done;t.missed+=s.missed;t.silent+=s.silent;t.bypassed+=s.bypassed;t.counted+=s.counted;}}
  t.pct=t.counted?Math.round(t.done/t.counted*100):null;return t;
}
function streaks(n){
  var cur=0,best=0,run=0,counting=true;
  var ts=dayScore(n.key,n),todayFull=ts&&ts.counted&&ts.done===ts.counted&&!ts.open;
  for(var i=1;i<=120;i++){
    var s=dayScore(addDays(n.key,-i),n);
    if(!s||!s.counted){continue;}
    if(s.done===s.counted){run++;if(counting)cur++;}else{counting=false;best=Math.max(best,run);run=0;}
  }
  best=Math.max(best,run);
  if(todayFull){cur++;best=Math.max(best,cur);}
  return {cur:cur,best:best};
}

/* ---------- API ---------- */
function api(method,url,body){
  return fetch(url,{method:method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null;}catch(e){}return {status:r.status,ok:r.ok,data:j};});});
}
function load(quiet){
  if(!state&&!quiet)renderSkeleton();
  var url=readOnly?'/api/state?token='+encodeURIComponent(viewToken):'/api/state';
  return api('GET',url).then(function(r){
    if(r.status===401){
      if(readOnly){loadErr='This view-only link isn\u2019t valid anymore. Ask for a new one.';renderError(false);return;}
      state=null;renderLogin('');return;
    }
    if(!r.ok){if(state){syncErr=true;renderSync();return;}loadErr=(r.data&&r.data.error)||('The server returned an error ('+r.status+').');renderError(true);return;}
    lastSync=Date.now();syncErr=false;loadErr='';
    if(state&&dirty){renderSync();return;}
    state=r.data.state;if(r.data.readToken)readToken=r.data.readToken;
    if(!readOnly&&!onb&&!state.onboarded&&!(state.rev>0)&&!state.commitments.length)onb={mode:'first',step:'pick'};
    render();
    if(!quiet)syncFeeds(false);
  },function(){
    if(state){syncErr=true;renderSync();return;}
    loadErr='Can\u2019t reach the server. Check your connection, then retry.';renderError(true);
  });
}
function save(){
  if(readOnly)return;
  var bad=false;
  Object.keys(state.log).forEach(function(k){Object.keys(state.log[k]).forEach(function(id){var e=state.log[k][id];if(NEEDS_WHY[e.s]&&!String(e.why||'').trim())bad=true;});});
  if(bad){barErr='Give a reason for every miss and bypass before saving.';render();return;}
  saving=true;barErr='';renderBar();
  api('PUT','/api/state',{state:state,rev:state.rev||0}).then(function(r){
    saving=false;
    if(r.ok){state=r.data.state;dirty=false;lastSync=Date.now();flash('Saved');return;}
    if(r.status===409){state=r.data.state;dirty=false;notice='Something was saved from an email button while you were editing. This is the latest. Redo your change.';render();return;}
    if(r.status===401){renderLogin('Your session ended. Sign in again, then redo your change.');return;}
    barErr='Save failed: '+(r.data&&r.data.error||r.status);render();
  },function(){saving=false;barErr='Save failed. Check your connection.';render();});
}
function flash(m){toast=m;render();setTimeout(function(){toast='';var t=document.querySelector('.toast');if(t)t.remove();},2000);}

/* ---------- System states ---------- */
function renderSkeleton(){
  app.innerHTML='<div class="skel-page" aria-busy="true" aria-label="Loading"><div class="skel skel-title"></div>'+
    '<div class="kpis">'+[1,2,3,4].map(function(){return '<div class="skel skel-kpi"></div>';}).join('')+'</div>'+
    '<div class="row"><div class="skel skel-card"></div><div class="skel skel-card"></div></div></div>';
}
function renderError(canRetry){
  app.innerHTML='<div class="login"><h1>Day by Datum</h1><div class="card"><p class="error-line">'+esc(loadErr)+'</p>'+
    (canRetry?'<button class="btn b-primary btn-wide" data-retry>Try again</button>':'')+'</div></div>';
}
function renderLogin(msg){
  app.innerHTML='<div class="login"><h1>Day by Datum</h1><p class="muted">Sign in to check in.</p>'+
    '<form id="login"><input type="password" name="password" autocomplete="current-password" placeholder="Password" required aria-label="Password">'+
    (msg?'<p class="error-line">'+esc(msg)+'</p>':'')+'<button class="btn b-primary" type="submit">Sign in</button></form></div>';
  document.getElementById('login').addEventListener('submit',function(ev){
    ev.preventDefault();
    api('POST','/api/login',{password:ev.target.password.value}).then(function(r){
      if(r.ok)load();else renderLogin(r.data&&r.data.error||'Sign-in failed.');
    });
  });
}

/* ---------- Home ---------- */
function healthData(n){
  var map={},order=[];
  for(var i=range-1;i>=0;i--){var dk=addDays(n.key,-i);
    unitsOn(dk).forEach(function(u){
      if(u.c.tier!=='device')return;
      var m=map[u.key];if(!m){m=map[u.key]={u:u,done:0,missed:0,silent:0,byp:0};order.push(u.key);}
      var e=entry(dk,u.key);
      if(e&&e.s==='done')m.done++;else if(e&&e.s==='missed')m.missed++;else if(e&&e.s==='bypassed')m.byp++;else if(isPast(dk,u,n))m.silent++;
    });}
  return order.map(function(k){var m=map[k];m.counted=m.done+m.missed+m.silent;m.rate=m.counted?m.done/m.counted:null;return m;});
}
function tipFor(title){
  var t=title.toLowerCase();
  if(/sleep|slept|bed|rest/.test(t))return 'Set a wind-down alarm 45 minutes before bed, and charge your phone outside the bedroom.';
  if(/step|walk/.test(t))return 'Add a 10-minute walk right after lunch. It closes about a third of a 10,000-step gap.';
  if(/exercise|workout|gym|train|run/.test(t))return 'Put the workout on your calendar with a start time. A slot beats an intention.';
  if(/water|hydrat/.test(t))return 'Keep a full bottle where you work and refill it at each checkpoint.';
  return 'Move it to a checkpoint where you actually have time, or shrink the target until it sticks.';
}
function healthCard(n){
  var hd=healthData(n);
  var tot={done:0,counted:0,silent:0};hd.forEach(function(m){tot.done+=m.done;tot.counted+=m.counted;tot.silent+=m.silent;});
  var pct=tot.counted?Math.round(tot.done/tot.counted*100):null;
  var pill=pct==null?['pill-none','No data yet']:pct>=85?['pill-good','On track']:pct>=60?['pill-warn','Slipping']:['pill-bad','Off track'];
  var h='<section class="card" aria-labelledby="h-health"><div class="card-head"><h2 id="h-health">Health</h2><span class="pill '+pill[0]+'">'+pill[1]+'</span></div>';
  if(!hd.length)return h+'<p class="empty">No health commitments yet. Add one tagged Apple Health.</p></section>';
  h+='<div class="hstat">'+ring(pct,pct==null?'var(--line-2)':pct>=85?'var(--done)':pct>=60?'var(--amber)':'var(--miss)')+'<span class="muted">of health check-ins done over the last '+range+' days</span></div>';
  hd.forEach(function(m){
    var r=m.rate==null?null:Math.round(m.rate*100),col=r==null?'var(--line)':r>=85?'var(--done)':r>=60?'var(--amber)':'var(--miss)';
    h+='<div class="hrow"><div class="hrow-top"><span>'+esc(fullTitle(m.u))+'</span><span class="muted">'+(m.counted?m.done+' of '+m.counted:'not due yet')+'</span></div>'+
      '<div class="hbar" role="img" aria-label="'+(r==null?'No data':r+'% done')+'"><i style="width:'+(r||0)+'%;background:'+col+'"></i></div></div>';
  });
  var tips=[];
  var usedTips={};
  hd.filter(function(m){return m.counted>=2&&m.rate<0.7;}).sort(function(a,b){return a.rate-b.rate;}).slice(0,2).forEach(function(m){
    var tip=tipFor(m.u.title),again=usedTips[tip];usedTips[tip]=1;
    tips.push('<b>'+esc(fullTitle(m.u))+'</b> is at '+m.done+' of '+m.counted+'. '+(again?'Same fix as above.':tip));});
  if(tot.silent>=2)tips.push('You left '+tot.silent+' health check-ins unanswered. An honest Missed is better than silence.');
  if(!tips.length&&pct!=null&&pct>=85)tips.push('Everything\u2019s holding. Keep the routine as is, and consider raising one target next week.');
  if(!tips.length)tips.push('Not enough data yet. Suggestions appear after a few days of check-ins.');
  h+='<h3 class="sub-h">Suggestions</h3><ul class="tips">'+tips.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>';
  h+='<p class="fine">Based on your check-ins. Live Apple Health data isn\u2019t connected yet.</p></section>';
  return h;
}
function attentionCard(n){
  var k=n.key,cps=state.settings.checkpoints;
  var overdue=unitsOn(k).filter(catOk).filter(function(u){return !entry(k,u.key)&&toMins(cps[u.c.slot])<=n.mins;});
  var soon=[];
  state.commitments.forEach(function(c){
    if(!isSpecial(c)||!(catFilter==='all'||c.tier===catFilter))return;
    for(var i=0;i<=3;i++){var dk=addDays(k,i);if(occurs(c,dk)){
      var open=units(c).some(function(u){var e=entry(dk,u.key);return !e||e.s!=='done';});
      if(open&&!(i===0&&overdue.some(function(u){return u.c.id===c.id;})))soon.push({c:c,k:dk,i:i});break;}}
  });
  var undated=state.commitments.filter(function(c){return (c.freq==='monthly'&&!c.day)||(c.freq==='once'&&!c.date);});
  var selKeys=Object.keys(selected).filter(function(x){return selected[x];});
  var total=overdue.length+soon.length+undated.length,shown=0,CAP=6;
  function capped(){shown++;return !attnAll&&shown>CAP;}
  var h='<section class="card" aria-labelledby="h-attn"><div class="card-head"><h2 id="h-attn">Needs attention</h2>'+
    (total?'<span class="pill '+(overdue.length?'pill-bad':'pill-warn')+'">'+total+'</span>':'')+'</div>';
  if(!total){
    var next=SLOTS.filter(function(s){return toMins(cps[s])>n.mins;})[0];
    return h+'<p class="empty">Nothing urgent. '+(next?'Next checkpoint at '+fmt12(cps[next])+'.':'The day\u2019s checkpoints are closed out.')+'</p></section>';
  }
  if(selKeys.length&&!readOnly){
    h+='<div class="bulk" role="toolbar" aria-label="Bulk actions"><b>'+selKeys.length+' selected</b>'+
      '<button class="btn b-done" data-bulk="done">Mark done</button><button class="btn" data-bulk="missed">Log miss</button>'+
      '<button class="btn" data-bulk="bypassed">Bypass</button><button class="btn link-btn" data-bulk="clear">Clear</button></div>';
  }
  h+='<ul class="attn">';
  if(overdue.length&&!readOnly){
    var all=overdue.every(function(u){return selected[u.key];});
    h+='<li class="attn-head"><label class="check"><input type="checkbox" data-selall'+(all?' checked':'')+'> <span>Overdue today</span></label></li>';
  } else if(overdue.length)h+='<li class="attn-head"><span>Overdue today</span></li>';
  overdue.forEach(function(u){
    if(capped())return;
    h+='<li>'+(readOnly?'':'<input type="checkbox" data-sel="'+u.key+'" aria-label="Select '+esc(fullTitle(u))+'"'+(selected[u.key]?' checked':'')+'>')+
      '<div class="grow"><b>'+esc(fullTitle(u))+'</b><div class="muted small">'+CAT[u.c.tier]+'. Due by '+fmt12(cps[u.c.slot])+'</div></div><span class="tag tag-silent">Overdue</span></li>';
  });
  soon.forEach(function(x){
    if(capped())return;
    h+='<li><span class="dotcol" style="background:var(--amber)"></span><div class="grow"><b>'+esc(x.c.title)+'</b>'+(x.c.amount?' <span class="muted">'+esc(x.c.amount)+'</span>':'')+
      '<div class="muted small">'+(isEvent(x.c)?(x.i===0?'Today, ':fmtDate(x.k)+', ')+eventMeta(x.c):(x.i===0?'Due today':'Due '+fmtDate(x.k)))+'</div></div><button class="btn btn-sm" data-openday="'+x.k+'">View</button></li>';
  });
  undated.forEach(function(c){
    if(capped())return;
    h+='<li><span class="dotcol" style="background:var(--muted)"></span><div class="grow"><b>'+esc(c.title)+'</b><div class="muted small">No due date set, so it never comes up</div></div>'+
      (readOnly?'':'<button class="btn btn-sm" data-edit-go="'+c.id+'">Set date</button>')+'</li>';
  });
  h+='</ul>';
  if(total>CAP)h+='<button class="link attn-more" data-attnall>'+(attnAll?'Show less':'Show all '+total)+'</button>';
  return h+'</section>';
}
function feedCard(n){
  var items=[];
  for(var i=0;i<range;i++){var dk=addDays(n.key,-i),lg=state.log[dk]||{};
    Object.keys(lg).forEach(function(key){var u=findUnit(key);if(u&&!catOk(u))return;var e=lg[key];
      items.push({k:dk,at:e.at||'00:00',title:unitTitle(key),s:e.s,why:e.why,via:e.via});});}
  items.sort(function(a,b){return a.k===b.k?(a.at<b.at?1:-1):(a.k<b.k?1:-1);});
  var shown=feedAll?items:items.slice(0,6);
  var h='<section class="card" aria-labelledby="h-feed"><div class="card-head"><h2 id="h-feed">Activity</h2><span class="muted small">Last '+range+' days</span></div>';
  if(!items.length)return h+'<p class="empty">No check-ins yet in this range. They show up here as you mark items, from the app or from email.</p></section>';
  h+='<ul class="feed">'+shown.map(function(x){
    return '<li>'+tagHTML(x.s)+'<div><b>'+esc(x.title)+'</b>'+(x.why?'<div class="muted small">\u201c'+esc(x.why)+'\u201d</div>':'')+'</div>'+
      '<button class="time-btn" data-openday="'+x.k+'"><time>'+fmtDate(x.k)+(x.at?', '+fmt12(x.at):'')+'</time>'+(x.via==='email'?'<span class="muted small"> by email</span>':'')+'</button></li>';
  }).join('')+'</ul>';
  if(items.length>6)h+='<button class="link" data-feedall>'+(feedAll?'Show less':'Show all '+items.length)+'</button>';
  return h+'</section>';
}
function viewHome(){
  var n=now(),k=n.key,cps=state.settings.checkpoints;
  var cur=periodStats(k,range,n),prev=periodStats(addDays(k,-range),range,n);
  var delta=cur.pct!=null&&prev.pct!=null?cur.pct-prev.pct:null;
  var us=unitsOn(k).filter(catOk);
  var open=us.filter(function(u){return !entry(k,u.key);});
  var overdue=open.filter(function(u){return toMins(cps[u.c.slot])<=n.mins;});
  var next=SLOTS.filter(function(s){return toMins(cps[s])>n.mins;})[0];
  var st=streaks(n);
  var due=null;
  for(var i=0;i<60&&!due;i++){var dk=addDays(k,i);
    state.commitments.forEach(function(c){if(due||!isSpecial(c)||!(catFilter==='all'||c.tier===catFilter)||!occurs(c,dk))return;
      if(units(c).some(function(u){var e=entry(dk,u.key);return !e||e.s!=='done';}))due={c:c,k:dk,i:i};});}

  var h='<div class="home">';
  h+='<section class="kpis" aria-label="Key metrics">';
  h+='<button class="kpi" data-tab="score"><span class="kpi-label">Completion, last '+range+' days</span><span class="kpi-mid"><span class="kpi-value">'+(cur.pct==null?'\u2014':cur.pct+'%')+'</span>'+sparkline(trendData(n).values)+'</span>'+
    '<span class="kpi-sub">'+(delta==null?(cur.pct==null?'Starts after your first checkpoint':'No earlier period to compare yet'):(delta>=0?'<span class="up">\u25b2 '+delta+' pts</span>':'<span class="down">\u25bc '+Math.abs(delta)+' pts</span>')+' vs prior '+range+' days')+'</span></button>';
  h+='<button class="kpi'+(overdue.length?' alert':'')+'" data-tab="today"><span class="kpi-label">Open today</span><span class="kpi-value">'+open.length+'</span>'+
    '<span class="kpi-sub">'+(overdue.length?'<span class="down">'+overdue.length+' overdue</span>':next?'Next checkpoint '+fmt12(cps[next]):'Checkpoints closed')+'</span></button>';
  h+='<button class="kpi" data-tab="cal"><span class="kpi-label">Perfect-day streak</span><span class="kpi-value">'+st.cur+'<small> day'+(st.cur===1?'':'s')+'</small></span>'+
    '<span class="kpi-sub">Best in 120 days: '+st.best+'</span></button>';
  h+=(due?'<button class="kpi" data-openday="'+due.k+'">':'<button class="kpi" data-tab="'+(readOnly?'cal':'commitments')+'">')+'<span class="kpi-label">Next due</span>'+
    (due?'<span class="kpi-value kpi-value-sm">'+(due.i===0?'Today':due.i===1?'Tomorrow':'In '+due.i+' days')+'</span><span class="kpi-sub">'+esc(due.c.title)+(due.c.amount?', '+esc(due.c.amount):'')+'</span>'
        :'<span class="kpi-value kpi-value-sm">None set</span><span class="kpi-sub">Add due dates to your payments and goals</span>')+'</button>';
  h+='</section>';
  h+='<div class="dash"><div class="c8">'+weekCard(n)+'</div><div class="c4">'+healthCard(n)+'</div>'+
    '<div class="c5">'+attentionCard(n)+'</div>'+
    '<div class="c4 chart"><section class="card" aria-labelledby="h-trend"><div class="card-head"><h2 id="h-trend">Daily completion</h2><span class="muted small">Tap a day</span></div>'+
    '<div class="chart-box"><canvas id="c-trend" role="img" aria-label="Daily completion over the last '+range+' days"></canvas></div><p class="chart-fallback" hidden>Charts couldn\u2019t load. Your numbers are still in the Scorecard.</p></section></div>'+
    '<div class="c3"><section class="card" aria-labelledby="h-cat"><div class="card-head"><h2 id="h-cat">By category</h2><span class="muted small">Tap to filter</span></div>'+
    '<div class="chart-box"><canvas id="c-cat" role="img" aria-label="Completion by category"></canvas></div><p class="chart-fallback" hidden>Charts couldn\u2019t load.</p></section></div>'+
    '<div class="c12">'+feedCard(n)+'</div></div>';
  return h+'</div>';
}
function sparkline(vals){
  var pts=[],w=84,h=28,n=vals.length;
  vals.forEach(function(v,i){if(v!=null)pts.push([n<2?w:i/(n-1)*w,h-2-(v/100)*(h-4)]);});
  if(pts.length<2)return '';
  var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  var last=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><path d="'+d+' L'+last[0].toFixed(1)+' '+h+' L'+pts[0][0].toFixed(1)+' '+h+' Z" fill="var(--accent-soft)"/>'+
    '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.4" fill="var(--accent)"/></svg>';
}
function ring(pct,color){
  var r=26,c=2*Math.PI*r,v=pct==null?0:pct;
  return '<svg class="ring" viewBox="0 0 64 64" role="img" aria-label="'+(pct==null?'No data':pct+'%')+'"><circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--card-2)" stroke-width="6"/>'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+(c*v/100).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 32 32)"/>'+
    '<text x="32" y="37" text-anchor="middle" class="ring-txt">'+(pct==null?'\u2014':pct+'%')+'</text></svg>';
}
function trendData(n){
  var labels=[],values=[],keys=[];
  for(var i=range-1;i>=0;i--){var dk=addDays(n.key,-i),s=dayScore(dk,n);
    keys.push(dk);labels.push(parseKey(dk).toLocaleDateString('en-US',{timeZone:'UTC',month:'short',day:'numeric'}));
    values.push(s&&s.counted?Math.round(s.done/s.counted*100):null);}
  return {labels:labels,values:values,keys:keys};
}
function catData(n){
  var saved=catFilter,out=[];
  CAT_KEYS.forEach(function(c){catFilter=c;var p=periodStats(n.key,range,n);out.push(p.pct);});
  catFilter=saved;return out;
}

/* ---------- Weekly progress ---------- */
function weekStart(k){var d=parseKey(k),off=(d.getUTCDay()+6)%7;return addDays(k,-off);}
function weekLabel(ws){
  var a=parseKey(ws),b=parseKey(addDays(ws,6)),o={timeZone:'UTC',month:'short',day:'numeric'};
  var la=a.toLocaleDateString('en-US',o),lb=a.getUTCMonth()===b.getUTCMonth()?String(b.getUTCDate()):b.toLocaleDateString('en-US',o);
  return la+'\u2013'+lb;
}
// Capacity = every task scheduled that week, minus bypasses. Only Done fills the bar.
function weekStats(ws,n){
  var w={total:0,done:0,pace:0,tasks:0,tasksDone:0,cat:{}};
  CAT_KEYS.forEach(function(c){w.cat[c]={total:0,done:0};});
  for(var i=0;i<7;i++){var dk=addDays(ws,i);
    unitsOn(dk).forEach(function(u){var e=entry(dk,u.key);
      if(e&&e.s==='bypassed')return;
      var wt=unitWeight(u),c=w.cat[u.c.tier];
      w.total+=wt;c.total+=wt;w.tasks++;
      if(e&&e.s==='done'){w.done+=wt;c.done+=wt;w.tasksDone++;}
      if(isPast(dk,u,n))w.pace+=wt;
    });}
  w.pct=w.total?Math.round(w.done/w.total*100):null;
  return w;
}
function segBar(w,cls){
  var segs=CAT_KEYS.map(function(c){var v=w.total?w.cat[c].done/w.total*100:0;
    return v?'<span class="seg" style="width:'+v.toFixed(2)+'%;background:var('+CAT_VAR[c]+')" title="'+CAT[c]+': '+pts(w.cat[c].done)+' points"></span>':'';}).join('');
  var label=(w.pct==null?'Nothing scheduled':w.pct+'% filled, '+pts(w.done)+' of '+pts(w.total)+' points. ')+CAT_KEYS.map(function(c){return CAT[c]+' '+pts(w.cat[c].done)+' of '+pts(w.cat[c].total)+' points';}).join(', ');
  return '<div class="'+cls+'" role="img" aria-label="'+esc(label)+'">'+segs+'</div>';
}
function dayStrip(ws,n){
  var h='<div class="wk-days" role="list" aria-label="Completion by day">';
  for(var i=0;i<7;i++){
    var dk=addDays(ws,i),tot=0,done=0,cat={};
    unitsOn(dk).forEach(function(u){var e=entry(dk,u.key);if(e&&e.s==='bypassed')return;var wt=unitWeight(u);tot+=wt;
      if(e&&e.s==='done'){done+=wt;cat[u.c.tier]=(cat[u.c.tier]||0)+wt;}});
    var pct=tot?Math.round(done/tot*100):null,future=dk>n.key;
    var segs=CAT_KEYS.filter(function(c){return cat[c];}).map(function(c){return '<i style="flex:'+cat[c].toFixed(2)+';background:var('+CAT_VAR[c]+')"></i>';}).join('');
    h+='<button class="wk-day'+(dk===n.key?' is-today':'')+(future?' future':'')+'" role="listitem" data-openday="'+dk+'" aria-label="'+fmtDate(dk,true)+': '+(pct==null?'nothing scheduled':pct+'% done')+'">'+
      '<span class="wk-col"><span class="wk-fill" style="height:'+(pct||0)+'%">'+segs+'</span></span>'+
      '<b>'+parseKey(dk).toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short'})+'</b><span>'+(future?'\u2013':pct==null?'\u2014':pct+'%')+'</span></button>';
  }
  return h+'</div>';
}
function weekCard(n){
  var ws=weekStart(n.key),w=weekStats(ws,n);
  var pacePct=w.total?Math.round(w.pace/w.total*100):0,diff=(w.pct||0)-pacePct;
  var paceTxt=!w.total?'':w.pace===0?'Week just started':diff>=0?'<span class="up">Ahead of pace by '+diff+' pts</span>':'<span class="down">Behind pace by '+Math.abs(diff)+' pts</span>';
  var h='<section class="card wk" aria-labelledby="h-wk"><div class="wk-head"><div><h2 id="h-wk">This week</h2><span class="muted small">'+weekLabel(ws)+'. Only completed tasks fill it, weighted by priority</span></div>'+
    '<div class="wk-num"><span class="kpi-value">'+(w.pct==null?'\u2014':w.pct+'%')+'</span><span class="muted small">'+pts(w.done)+' of '+pts(w.total)+' points, '+w.tasksDone+' of '+w.tasks+' tasks</span></div></div>';
  h+='<div class="wk-track">'+segBar(w,'wk-bar')+(w.total&&w.pace?'<span class="wk-pace'+(pacePct<12?' al-l':pacePct>88?' al-r':'')+'" style="left:'+pacePct+'%" title="Where you\u2019d be if you were caught up"><i></i><b>On pace: '+pacePct+'%</b></span>':'')+'</div>';
  h+='<div class="wk-foot"><ul class="wk-legend">'+CAT_KEYS.filter(function(c){return w.cat[c].total>0;}).map(function(c){var x=w.cat[c];
    return '<li><i style="background:var('+CAT_VAR[c]+')"></i><b>'+CAT[c]+'</b><span class="muted">'+pts(x.done)+' of '+pts(x.total)+' pts</span></li>';}).join('')+'</ul>'+
    '<div class="wk-right">'+(paceTxt?'<span class="small">'+paceTxt+'</span>':'')+'<button class="link" data-tab="progress">See progress history</button></div></div>'+dayStrip(ws,n)+'</section>';
  return h;
}
function viewHistory(){
  var n=now(),cur=weekStart(n.key),first=null;
  state.commitments.forEach(function(c){if(c.since&&(!first||c.since<first))first=c.since;});
  var startWk=weekStart(first||n.key),weeks=[];
  for(var ws=cur;ws>=startWk&&weeks.length<52;ws=addDays(ws,-7))weeks.push(ws);
  var stats=weeks.map(function(ws){return {ws:ws,w:weekStats(ws,n)};});
  var done=stats.filter(function(x){return x.ws!==cur&&x.w.total;});
  var best=done.reduce(function(b,x){return !b||x.w.pct>b.w.pct?x:b;},null);
  var avg=done.length?Math.round(done.reduce(function(a,x){return a+x.w.pct;},0)/done.length):null;
  var h='<div class="hist">';
  h+='<div class="hist-sum"><div><span class="kpi-label">Weeks tracked</span><span class="kpi-value">'+weeks.length+'</span></div>'+
    '<div><span class="kpi-label">Average fill</span><span class="kpi-value">'+(avg==null?'\u2014':avg+'%')+'</span>'+(avg==null?'<span class="muted small">After your first full week</span>':'')+'</div>'+
    '<div><span class="kpi-label">Best week</span><span class="kpi-value">'+(best?best.w.pct+'%':'\u2014')+'</span>'+(best?'<span class="muted small">'+weekLabel(best.ws)+'</span>':'')+'</div></div>';
  h+='<ul class="wk-legend hist-legend">'+CAT_KEYS.map(function(c){return '<li><i style="background:var('+CAT_VAR[c]+')"></i><b>'+CAT[c]+'</b></li>';}).join('')+'<li class="muted">Empty track is unfinished work. Weighted by priority</li></ul>';
  h+='<ol class="hist-list">'+stats.map(function(x){var w=x.w,isCur=x.ws===cur;
    return '<li class="hist-row'+(isCur?' cur':'')+'"><div class="hist-when"><b>'+weekLabel(x.ws)+'</b>'+(isCur?'<span class="muted small">In progress</span>':'')+'</div>'+
      segBar(w,'mini-bar')+'<div class="hist-num"><b>'+(w.pct==null?'\u2014':w.pct+'%')+'</b><span class="muted small">'+pts(w.done)+'/'+pts(w.total)+' pts</span></div></li>';}).join('')+'</ol>';
  if(weeks.length<2)h+='<p class="muted" style="margin-top:14px">Your history starts here. A new bar appears every Monday.</p>';
  return h+'</div>';
}

/* ---------- Today ---------- */
function viewToday(){
  var n=now(),k=n.key,cps=state.settings.checkpoints;
  var comms=state.commitments.filter(function(c){return occurs(c,k);});
  var us=unitsOn(k);
  function st(u){var e=entry(k,u.key);return e&&e.s;}
  function isLate(u){return !st(u)&&toMins(cps[u.c.slot])<=n.mins;}
  var done=us.filter(function(u){return st(u)==='done';}).length;
  var missed=us.filter(function(u){return st(u)==='missed';}).length;
  var byp=us.filter(function(u){return st(u)==='bypassed';}).length;
  var late=us.filter(isLate).length;
  var next=SLOTS.filter(function(s){return toMins(cps[s])>n.mins;})[0];
  function pct(m){return Math.min(100,Math.max(0,(m-300)/(1440-300)*100));}
  var h='<div class="today-grid"><aside class="today-side"><section class="hero"><div class="hero-time">'+(next?fmt12(cps[next]):'Day closed')+'</div>'+
    '<div class="hero-label">'+(next?SLOT_NAME[next]+' checkpoint is next':'All three checkpoints have passed. Close out what\u2019s left.')+'</div>'+
    '<div class="track" aria-hidden="true"><div class="track-line"></div><div class="track-fill" style="width:'+pct(n.mins)+'%"></div>';
  SLOTS.forEach(function(s){
    var m=toMins(cps[s]),passed=m<=n.mins,lateS=passed&&us.some(function(u){return u.c.slot===s&&isLate(u);});
    h+='<div class="tick'+(passed?' passed':'')+(lateS?' late':'')+'" style="left:'+Math.min(94,Math.max(6,pct(m)))+'%"><i></i><span>'+fmt12(cps[s]).replace(':00','')+'</span></div>';
  });
  h+='<div class="now" style="left:'+pct(n.mins)+'%"></div></div><div class="stats"><span>'+done+' of '+(us.length-byp)+' done</span>'+
    (late?'<span class="bad-text">'+late+' overdue</span>':'')+(missed?'<span class="bad-text">'+missed+' missed</span>':'')+
    (byp?'<span class="muted">'+byp+' bypassed</span>':'')+'</div></section>';
  var notes=[];
  if(notice)notes.push(esc(notice));
  var noDay=state.commitments.filter(function(c){return (c.freq==='monthly'&&!c.day)||(c.freq==='once'&&!c.date);});
  if(noDay.length&&!readOnly)notes.push('No due date set for '+noDay.map(function(c){return esc(c.title);}).join(', ')+'. They won\u2019t show up until you set one. <button class="link" data-goto="commitments">Set due dates</button>');
  state.commitments.forEach(function(c){
    if(!((c.freq==='monthly'&&c.day)||(c.freq==='once'&&c.date)))return;
    for(var i=1;i<=5;i++){var kk=addDays(k,i);if(occurs(c,kk)){notes.push(esc(c.title)+(c.amount?' ('+esc(c.amount)+')':'')+' is due in '+i+' day'+(i>1?'s':'')+', '+fmtDate(kk)+'.');break;}}
  });
  if(notes.length)h+='<div class="notice">'+notes.map(function(x){return '<p>'+x+'</p>';}).join('')+'</div>';
  h+='</aside><div class="today-main">';
  function row(u){
    var e=entry(k,u.key),s2=e&&e.s,lt=isLate(u),c=u.c;
    var meta=u.sub?'':(prioOf(c)==='high'?'<span class="prio prio-high">High</span> ':'')+(isEvent(c)?'Event, '+eventMeta(c):TIER[c.tier])+(c.amount?', '+esc(c.amount):'');
    var stamp=e&&e.at?'marked '+fmt12(e.at)+(e.via==='email'?' by email':''):'';
    var metaLine=[meta,lt?'<span class="late-tag">Overdue</span>':'',stamp].filter(Boolean).join(' \u2022 ');
    var btn=function(act,label,cls){return '<button class="btn '+cls+'" data-act="'+act+'" data-id="'+u.key+'" aria-pressed="'+(s2===act)+'">'+label+'</button>';};
    var actions=readOnly?(s2?tagHTML(s2):(lt?tagHTML('silent'):'')):btn('done','Done','b-done')+btn('missed','Missed','b-miss')+btn('bypassed','Bypass','b-byp');
    return '<li class="item'+(u.sub?' sub':'')+(s2?' '+s2:(lt?' overdue':''))+'"><div><span class="item-title">'+esc(u.title)+'</span>'+
      (metaLine?'<span class="item-meta">'+metaLine+'</span>':'')+'</div><div class="item-actions">'+actions+'</div>'+
      (NEEDS_WHY[s2]&&!readOnly?'<label class="why">'+(s2==='missed'?'Why did you miss it?':'Why bypass it?')+'<input data-why="'+u.key+'" value="'+esc(e.why||'')+'" placeholder="Be specific. No \u201cjust didn\u2019t.\u201d"'+(String(e.why||'').trim()?'':' class="need"')+'></label>':'')+
      (NEEDS_WHY[s2]&&readOnly&&e.why?'<p class="why-ro">\u201c'+esc(e.why)+'\u201d</p>':'')+'</li>';
  }
  SLOTS.forEach(function(s){
    var list=comms.filter(function(c){return c.slot===s;});
    if(!list.length)return;
    var su=us.filter(function(u){return u.c.slot===s;});
    var passed=toMins(cps[s])<=n.mins,lateN=su.filter(isLate).length;
    h+='<section class="slot"><div class="slot-head"><h2>'+SLOT_NAME[s]+'</h2><span'+(lateN?' class="bad-text"':'')+'>'+
      (lateN?lateN+' overdue since '+fmt12(cps[s]):(passed?'Was due '+fmt12(cps[s]):'Due by '+fmt12(cps[s])))+'</span></div><ul class="items">';
    list.forEach(function(c){
      var uu=units(c);
      if(uu[0].sub)h+='<li class="item group"><div><span class="item-title">'+esc(c.title)+'</span><span class="item-meta">'+(prioOf(c)==='high'?'<span class="prio prio-high">High</span> ':'')+TIER[c.tier]+(c.amount?', '+esc(c.amount):'')+'</span></div></li>';
      uu.forEach(function(u){h+=row(u);});
    });

  });
  if(!comms.length)h+='<p class="muted" style="margin-top:24px">Nothing is scheduled for today.</p>';
  h+='<p class="foot">Anything not marked by its checkpoint counts as missed. Bypasses don\u2019t count against you, but they stay on your record.</p></div></div>';
  return h;
}

/* ---------- Calendar ---------- */

/* ---------- Scorecard ---------- */
function viewScore(){
  var n=now(),k=n.key,h='',tot=periodStats(k,range,n);
  h+='<div class="big">'+(tot.pct==null?'No data':tot.pct+'%')+'</div><p class="muted" style="margin:6px 0 0">'+(tot.pct==null?'Your first checkpoint hasn\u2019t passed yet.':'done over the last '+range+' days'+(catFilter!=='all'?', '+CAT[catFilter]+' only':''))+'</p>';
  if(tot.counted||tot.bypassed)h+='<div class="stats" style="margin-top:12px"><span>'+tot.done+' done</span><span class="bad-text">'+tot.missed+' missed</span><span class="bad-text">'+tot.silent+' never marked</span><span class="muted">'+tot.bypassed+' bypassed</span></div>';
  h+='<h2 class="sec">Last 14 days</h2><div class="grid">';
  for(var j=13;j>=0;j--){

// Parse a calendar file into event instances from today through `days` ahead.
function icsInstances(text,days){
  var pz=icsParse(text),n=now(),a=n.key,b=addDays(n.key,days||60),moved={},out=[];
  pz.events.forEach(function(e){if(e.recurId){var w=icsWhen(e.recurId);if(w)moved[e.uid+'|'+w.key]=1;}});
  pz.events.forEach(function(e){
    if(!e.start||e.status==='CANCELLED')return;
    var list=e.recurId?[icsWhen(e.start)]:icsExpand(e,a,b);
    list.forEach(function(w){
      if(!w||w.key<a||w.key>b)return;
      if(!e.recurId&&moved[e.uid+'|'+w.key])return;
      out.push({key:(e.uid||e.title)+'|'+w.key,title:e.title||'(untitled)',date:w.key,time:w.time,where:e.where||''});
    });
  });
  out.sort(function(x,y){return (x.date+x.time)<(y.date+y.time)?-1:1;});
  return {name:pz.name,items:out};
}
function hashKey(t){var h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return h.toString(36);}
function icsToEvent(it,src,prio){
  return {id:'ic'+hashKey(src+it.key),kind:'event',title:it.title,tier:'event',freq:'once',date:it.date,time:it.time,allDay:!it.time,
    slot:it.time?slotFor(it.time):'morning',where:it.where,who:'',amount:'',priority:prio,q:['fixed'],priorityManual:prio!==suggestPrio(['fixed']).p,
    since:it.date,src:src,srcKey:it.key};
}
function hasLog(id){return Object.keys(state.log).some(function(k){return !!state.log[k][id];});}
// Add new instances, update moved/renamed ones, and drop future unmarked ones that disappeared.
function mergeItems(src,items,prio,skip){
  var today=now().key,have={},inc={},r={added:0,updated:0,removed:0};skip=skip||{};
  items=items.filter(function(it){return !skip[it.key];});
  items.forEach(function(it){inc[it.key]=1;});
  state.commitments.forEach(function(c){if(c.src===src)have[c.srcKey]=c;});
  state.commitments=state.commitments.filter(function(c){
    if(c.src!==src||c.date<today||inc[c.srcKey]||hasLog(c.id))return true;
    r.removed++;return false;});
  items.forEach(function(it){var c=have[it.key];
    if(c){if(c.title!==it.title||c.time!==it.time||c.where!==it.where||c.date!==it.date){
      c.title=it.title;c.time=it.time;c.date=it.date;c.where=it.where;c.allDay=!it.time;c.slot=it.time?slotFor(it.time):'morning';r.updated++;}}
    else{state.commitments.push(icsToEvent(it,src,prio));r.added++;}});

function syncFeeds(force,onlyId){

/* ---------- Export ---------- */
function exportCSV(){
  var n=now(),cps=state.settings.checkpoints,rows=[['Date','Item','Category','Checkpoint','Status','Reason','Marked at','Via']];
  for(var i=range-1;i>=0;i--){var dk=addDays(n.key,-i);
    unitsOn(dk).filter(catOk).forEach(function(u){var e=entry(dk,u.key);
      var stt=e?(STATUS_LBL[e.s]||e.s):(isPast(dk,u,n)?'Never marked':'Open');
      rows.push([dk,fullTitle(u),CAT[u.c.tier],SLOT_NAME[u.c.slot],stt,e&&e.why||'',e&&e.at||'',e&&e.via||'']);});}
  var cell=function(v){v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  var csv=rows.map(function(r){return r.map(cell).join(',');}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='day-by-datum_'+n.key+'_last-'+range+'-days'+(catFilter!=='all'?'_'+CAT[catFilter].toLowerCase():'')+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}

/* ---------- Search ---------- */
function searchResults(q){
  q=q.trim().toLowerCase();if(!q)return [];
  var out=[];
  state.commitments.forEach(function(c){
    var hay=(c.title+' '+(c.parts||[]).map(function(p){return p.title;}).join(' ')).toLowerCase();
    if(hay.indexOf(q)>-1)out.push({kind:'c',id:c.id,title:c.title,sub:CAT[c.tier]+'. '+freqText(c)});
  });
  var n=now();
  for(var i=0;i<90;i++){var dk=addDays(n.key,-i),lg=state.log[dk]||{};
    Object.keys(lg).forEach(function(key){var e=lg[key],t=unitTitle(key);
      if((e.why||'').toLowerCase().indexOf(q)>-1||t.toLowerCase().indexOf(q)>-1&&NEEDS_WHY[e.s])out.push({kind:'d',k:dk,title:t,sub:(STATUS_LBL[e.s]||'')+' '+fmtDate(dk)+(e.why?': \u201c'+e.why+'\u201d':'')});});}
  return out.slice(0,12);
}
function renderSearch(){
  var box=document.getElementById('search-results');if(!box)return;
  if(!query.trim()){box.hidden=true;box.innerHTML='';return;}
  var r=searchResults(query);box.hidden=false;
  box.innerHTML=r.length?r.map(function(x){
    return '<button class="sr" '+(x.kind==='c'?(readOnly?'data-tab="cal"':'data-edit-go="'+x.id+'"'):'data-openday="'+x.k+'"')+'><b>'+esc(x.title)+'</b><span>'+esc(x.sub)+'</span></button>';
  }).join(''):'<p class="sr-empty">No matches for \u201c'+esc(query)+'\u201d.</p>';
}

  if(el.dataset.onbcp&&el.value){onb.cps[el.dataset.onbcp]=el.value;return;}
  if(el.dataset.onbday!=null){var dv=parseInt(el.value,10);onb.day[el.dataset.onbday]=isNaN(dv)?null:dv;return;}
  if(el.dataset.calsel!=null){modal.sel[el.dataset.calsel]=el.checked;render();return;}
  if(el.hasAttribute('data-calprio')){modal.prio=el.value;return;}
  if(el.hasAttribute('data-calfile')){
    var files=[].slice.call(el.files||[]);if(!files.length)return;
    modal.busy=true;modal.err='';render();
    Promise.all(files.map(function(f){return new Promise(function(ok,bad){var fr=new FileReader();fr.onload=function(){ok({name:f.name,text:String(fr.result)});};fr.onerror=function(){bad(new Error('Couldn\u2019t read '+f.name));};fr.readAsText(f);});}))
      .then(function(list){
        var items=[],meta=[];
        list.forEach(function(x){
          if(x.text.indexOf('BEGIN:VCALENDAR')<0)throw new Error(x.name+' isn\u2019t a calendar file.');
          var r=icsInstances(x.text,60),src='file:'+modal.prov+':'+(r.name||x.name);
          meta.push({name:r.name||x.name.replace(/\.ics$/i,''),src:src});
          r.items.forEach(function(it){it.file=src;items.push(it);});
        });
        items.sort(function(a2,b2){return (a2.date+a2.time)<(b2.date+b2.time)?-1:1;});
        modal.files=meta;modal.items=items;modal.calName=meta.length===1?meta[0].name:meta.length+' calendars';
        modal.sel={};items.forEach(function(x,i){modal.sel[i]=true;});modal.busy=false;modal.step='preview';render();
      }).catch(function(e){modal.busy=false;modal.err=e.message;render();});
    return;}
  if(el.hasAttribute('data-range')){range=Number(el.value);render();return;}
  if(el.hasAttribute('data-cat')){catFilter=el.value;selected={};render();return;}
  if(el.dataset.sel){selected[el.dataset.sel]=el.checked;render();return;}
  if(el.hasAttribute('data-selall')){if(el.checked)attnAll=true;var n=now(),cps=state.settings.checkpoints;
    unitsOn(n.key).filter(catOk).filter(function(u){return !entry(n.key,u.key)&&toMins(cps[u.c.slot])<=n.mins;}).forEach(function(u){selected[u.key]=el.checked;});render();return;}
  if(el.dataset.cp&&el.value){state.settings.checkpoints[el.dataset.cp]=el.value;dirty=true;render();}
  if(el.dataset.q){readForm();if(!editing.priorityManual)editing.priority=suggestPrio(editing.q).p;render();return;}
  if(el.dataset.f==='priority'){readForm();editing.priorityManual=editing.priority!==suggestPrio(editing.q).p;render();return;}
  if(el.dataset.f==='freq'||el.dataset.f==='tier'){readForm();render();}
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Escape')return;
  if(modal){modal=null;render();}else if(menuOpen){menuOpen=false;render();}else if(navOpen){navOpen=false;render();}
  else if(query){query='';var q=document.getElementById('q');if(q)q.value='';renderSearch();}
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&state&&!dirty&&!modal)load(true);});
setInterval(function(){
  if(document.visibilityState!=='visible'||!state)return;
  var a=document.activeElement;
  if(dirty||modal||menuOpen||(a&&a.matches&&a.matches('input,select,textarea')))return;
  load(true);
},60000);
setInterval(renderSync,30000);
load();
})();
</script>
</body>
